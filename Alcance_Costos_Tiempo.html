<title>Hambre de Poder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: 1280x720 stage scaled to fit. Dark-green liquid background (template v3) + a live canvas effect per slide; glass cards with lime outlines, white numbered panels, gradient detail cards. */
:root{--g1:#01F495;--g2:#3A755D;--g3:#2F4039;--gd:#04271B;--ink:#123326;--mint:#CFF9E6;--blue:#027AFE;--yel:#FFD21F;--red:#FF6B5B;--glass:rgba(3,48,32,.52);--glass2:rgba(3,48,32,.72);--ln:rgba(1,244,149,.75);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--gd);color:#fff;font-family:'Montserrat',system-ui,sans-serif;overflow:hidden}
#fit{position:absolute;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#0a5d3a}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.s{position:absolute;inset:0;visibility:hidden;opacity:0;transition:opacity .55s,visibility 0s .55s;overflow:hidden}
.s.on{visibility:visible;opacity:1;transition:opacity .55s}
.bgi{position:absolute;inset:-40px;background-size:cover;background-position:center;animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.04) translate(-14px,6px)}to{transform:scale(1.16) translate(18px,-12px)}}
.s .shade{position:absolute;inset:0;background:radial-gradient(120% 90% at 30% 40%,rgba(2,40,26,.18),rgba(2,40,26,.5))}
.s canvas{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none}
#logo{position:absolute;left:34px;top:22px;width:150px;z-index:6;transition:opacity .4s}
#stage.full #logo{opacity:0}
.in{position:absolute;left:70px;right:70px;top:84px;bottom:70px}
.h{font-weight:800;font-size:34px;line-height:1.1;margin:0 0 10px;text-wrap:balance;letter-spacing:-.2px;text-shadow:0 2px 18px rgba(0,40,25,.35)}
.lead{font-size:15.5px;line-height:1.5;margin:0;font-weight:500}
.eye{font-size:12px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;color:#aaffd9;margin-bottom:8px;text-shadow:0 1px 10px rgba(0,30,18,.95),0 0 2px rgba(0,30,18,.6)}
.rv{opacity:0;transform:translateY(16px)}
.on .rv{animation:rv .6s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*90ms + 200ms)}
@keyframes rv{to{opacity:1;transform:none}}
.abs{position:absolute}
.mas{position:absolute;pointer-events:none;filter:drop-shadow(0 12px 22px rgba(0,0,0,.35))}
#nav{position:absolute;right:26px;bottom:20px;display:flex;align-items:center;gap:6px;background:rgba(4,39,27,.72);backdrop-filter:blur(8px);border:1.5px solid rgba(1,244,149,.5);border-radius:999px;padding:5px 8px;z-index:20}
#nav button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:800}
#nav button:hover{background:rgba(1,244,149,.28)}
#nav span{font-weight:700;font-size:14px;min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
#bar{position:absolute;left:0;top:0;height:5px;background:linear-gradient(90deg,var(--g2),var(--g1));width:0;z-index:30;transition:width .5s}
#sec{position:absolute;left:34px;bottom:26px;z-index:6;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.75)}
#idx{position:absolute;inset:0;z-index:40;background:rgba(3,30,20,.95);display:none;padding:46px 70px;overflow:auto}
#idx.on{display:block}
#idx h2{margin:0 0 18px;font-size:26px;font-weight:800;color:var(--g1)}
#idx .gr2{display:grid;grid-template-columns:repeat(3,1fr);gap:9px 18px}
#idx button{display:flex;gap:12px;align-items:center;text-align:left;padding:9px 14px;border-radius:12px;background:var(--glass);font-weight:600;font-size:14.5px}
#idx button:hover{background:rgba(1,244,149,.28)}
#idx button b{color:var(--g1);min-width:26px;font-weight:800}
/* cover */
.t1{font-weight:900;font-size:58px;line-height:1.02;letter-spacing:-.8px;text-wrap:balance;text-shadow:0 4px 26px rgba(0,40,25,.4)}
.rule{height:1.5px;background:rgba(255,255,255,.55)}
.slog{position:absolute;left:60px;bottom:40px;font-weight:600;font-size:14px;z-index:3;line-height:1.3;max-width:360px}
.slog b{display:block;font-size:34px;font-weight:500;line-height:1.05}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:var(--glass2);border:1.5px solid rgba(255,255,255,.6);border-radius:999px;padding:7px 15px;font-weight:700;font-size:13.5px;backdrop-filter:blur(4px)}
/* components */
.card{border:2.5px solid var(--ln);border-radius:22px;background:var(--glass);backdrop-filter:blur(3px);padding:16px 18px;transition:.25s}
.card.pick{background:linear-gradient(135deg,#1fd391,var(--g1));border-color:transparent;color:var(--ink)}
.wp{background:#fff;color:var(--g3);border-radius:16px;padding:14px 20px}
.wp .num{font-size:40px;font-weight:800;line-height:1}
.band{background:var(--glass2);border-left:6px solid var(--g1);border-radius:14px;padding:12px 18px;font-weight:600;font-size:14px;line-height:1.45}
.band b{color:var(--g1);font-weight:800}
.warn{background:#FFF4CC;color:#3a3000;border-left:6px solid var(--yel);border-radius:12px;padding:11px 16px;font-size:13.5px;line-height:1.45;font-weight:600}
.warn b{font-weight:800}
.tabs{display:grid;gap:8px}
.tab{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 15px;border-radius:16px;border:2px solid var(--ln);background:var(--glass);transition:.25s;font-weight:800;font-size:14.5px;line-height:1.2}
.tab b.n{font-size:24px;font-weight:800;color:var(--g1);min-width:34px;line-height:1;transition:.25s}
.tab:hover{background:var(--glass2)}
.tab.on2{background:linear-gradient(100deg,#1fd391,var(--g1));border-color:transparent;color:var(--ink);transform:translateX(6px)}
.tab.on2 b.n{color:var(--ink)}
.det{background:linear-gradient(160deg,#01F495 0%,#19c98b 70%,#2fae7d 130%);border-radius:24px;padding:20px 24px;color:var(--ink)}
.det h3{margin:0 0 8px;font-size:23px;font-weight:800;line-height:1.12}
.det .k{display:block;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#0b4a33;margin:10px 0 3px}
.det .k:first-child{margin-top:0}
.det .v{font-size:14.5px;line-height:1.45;font-weight:600;display:block}
.pill{display:inline-block;border-radius:999px;padding:5px 12px;font-weight:800;font-size:12.5px;background:rgba(1,244,149,.22);border:1.5px solid var(--ln)}
.ck{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:8px 12px;border-radius:14px;font-weight:600;font-size:13.5px;line-height:1.35;transition:.2s}
.ck:hover{background:var(--glass)}
.ck i{flex:none;width:24px;height:24px;border-radius:50%;border:2.5px solid var(--g1);display:grid;place-items:center;font-style:normal;font-weight:900;color:transparent;font-size:14px;transition:.2s}
.ck.on2 i{background:var(--g1);color:var(--ink)}
.tg{display:inline-flex;background:var(--glass2);border-radius:999px;padding:4px;gap:3px}
.tg button{padding:8px 18px;border-radius:999px;font-weight:800;font-size:14px}
.tg button.on2{background:var(--g1);color:var(--ink)}
.btn{background:var(--g1);color:var(--ink);border-radius:999px;padding:9px 18px;font-weight:800;font-size:13.5px;transition:.2s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn.alt{background:var(--glass2);color:#fff;border:1.5px solid rgba(255,255,255,.5)}
table.t{border-collapse:separate;border-spacing:0 6px;width:100%}
table.t th{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;text-align:left;color:var(--g1);padding:0 10px}
table.t td{background:var(--glass);padding:8px 10px;font-size:13px;line-height:1.35;vertical-align:top}
table.t td:first-child{border-radius:12px 0 0 12px;font-weight:800}
table.t td:last-child{border-radius:0 12px 12px 0}
input[type=range]{accent-color:#01F495;height:22px}
input[type=number]{font:inherit;font-weight:800;border:2px solid var(--g1);border-radius:10px;padding:6px 8px;width:84px;color:var(--ink);background:#fff}
input[type=text]{font:inherit;font-weight:600;border:2px solid var(--g1);border-radius:999px;padding:8px 16px;color:var(--ink);background:#fff;width:300px}
.mono{font-variant-numeric:tabular-nums}
.mt{height:10px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}
.mt i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g1));border-radius:6px;transition:width .5s}
.kpi{background:var(--glass);border-radius:16px;border-top:4px solid var(--g1);padding:9px 11px}
.kpi.bad{border-top-color:var(--red)}
.kpi small{display:block;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--mint)}
.kpi b{font-size:22px;font-weight:800;display:block;line-height:1.15}
.kpi.bad b{color:#ffb0a6}
.kpi span{font-size:10.5px;font-weight:600;opacity:.85;display:block;line-height:1.25}
/* gantt */
.gx{position:absolute}
.gr0{display:grid;grid-template-columns:210px 1fr;align-items:center;height:36px;border-bottom:1px solid rgba(255,255,255,.14)}
.gr0 .lb{font-weight:700;font-size:13px;white-space:nowrap}
.gr0 .tr{position:relative;height:36px;background:repeating-linear-gradient(90deg,transparent 0,transparent 49px,rgba(255,255,255,.14) 49px,rgba(255,255,255,.14) 50px)}
.gb{position:absolute;top:6px;height:24px;border-radius:8px;background:var(--g2);transition:left .5s,width .5s,background .3s;color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;padding-left:8px;white-space:nowrap;border:1.5px solid rgba(255,255,255,.4)}
.gb.cr{background:var(--g1);color:var(--ink);border-color:var(--yel);box-shadow:0 0 0 2px var(--yel)}
.gb.sel{box-shadow:0 0 0 3px #fff}
.gs{position:absolute;top:10px;height:22px;border-radius:0 7px 7px 0;border:2px dashed rgba(255,255,255,.6);border-left:0;transition:.5s}
/* flip */
.flip{perspective:900px;height:150px}
.flip>div{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on2>div{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:13px 15px;text-align:left}
.flip .f{background:var(--glass);border:2.5px solid var(--ln);display:flex;flex-direction:column;justify-content:space-between}
.flip .f b{font-size:15px;line-height:1.25;font-weight:800}
.flip .f span{font-size:11.5px;font-weight:700;color:var(--g1)}
.flip .b{background:linear-gradient(160deg,#01F495,#19c98b);color:var(--ink);transform:rotateY(180deg);font-size:12.5px;line-height:1.38;font-weight:600;overflow:hidden}
.flip .b b{display:block;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:#0b4a33;margin-top:5px}
.flip .b b:first-child{margin-top:0}
.qo{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:11px 16px;border-radius:16px;border:2px solid var(--ln);background:var(--glass);font-weight:700;font-size:14px;line-height:1.35;transition:.2s}
.qo:hover{background:var(--glass2)}
.qo b{flex:none;width:28px;height:28px;border-radius:50%;background:rgba(1,244,149,.25);display:grid;place-items:center;font-size:13px}
.qo.ok{background:#01F495;color:var(--ink);border-color:#fff}
.qo.ok b{background:#fff}
.qo.no{background:rgba(255,107,91,.85);color:#fff;border-color:#fff}
.qo.no b{background:rgba(255,255,255,.3)}
.mov{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:800;font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;background:#FFD21F;color:#3a3000}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.on .rv{animation:none}.bgi{animation:none}}
</style>
<div id="fit"><div id="stage" class="full">
<div id="bar"></div>
<img id="logo" data-m="logo" alt="UNIMINUTO Cundinamarca Boyacá">
<div id="sec"></div>
<div id="nav"><button id="ix" aria-label="Índice" title="Índice">☰</button><button id="pv" aria-label="Anterior">‹</button><span id="ct">1 / 1</span><button id="nx" aria-label="Siguiente">›</button></div>
<div id="idx"><h2>Índice de la presentación</h2><div class="gr2" id="idxg"></div></div>
</div></div>
<script>
var SL=[];function add(o){SL.push(o)}
function IMG(k,st){return '<img class="mas" data-m="'+k+'" style="'+st+'" alt="">'}
function fmt(n,d){return Number(n).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d})}
function sel(l,i,c){l.forEach(function(e,k){e.classList.toggle(c||'on2',k===i)})}
function tabs(root,list,det,data,render,hover){var bs=window.$$(list,root);bs.forEach(function(b,i){var f=function(){sel(bs,i);window.$(det,root).innerHTML=render(data[i],i)};b.onclick=f;if(hover)b.onmouseenter=f});bs[0].onclick();return bs}
function HEAD(eye,h,mw){return '<div class="eye rv">'+eye+'</div><h1 class="h rv" style="--i:1;max-width:'+(mw||1000)+'px">'+h+'</h1>'}
function TAB(label,n){return '<button class="tab">'+(n?'<b class="n">'+n+'</b>':'')+'<span>'+label+'</span></button>'}
function K(t){return '<span class="k">'+t+'</span>'}
function V(t){return '<span class="v">'+t+'</span>'}
function mkTabs(root,sel,data,hasNum){var l=window.$(sel,root);data.forEach(function(d,i){l.insertAdjacentHTML('beforeend',TAB(d[0],hasNum?i+1:0))})}
function flips(root,sel,data,labels,h){var g=window.$(sel,root);data.forEach(function(a,k){var d=document.createElement('button');d.className='flip';d.style.height=(h||150)+'px';d.innerHTML='<div><div class="f"><span>0'+(k+1)+'</span><b>'+a[0]+'</b><span>Toca para ver ↻</span></div><div class="b"><b>'+labels[0]+'</b>'+a[1]+'<b>'+labels[1]+'</b>'+a[2]+'</div></div>';d.onclick=function(){d.classList.toggle('on2')};g.appendChild(d)})}
/* quiz slide builder: Q=[[pregunta,[opciones],idxCorrecta,explicacion]] */
function quizSlide(n,t,sec,fx,eye,title,Q,tag){add({n:n,t:t,sec:sec,fx:fx,html:'<div class="in">'+HEAD(eye,title,1100)+
'<div class="rv abs" style="--i:2;left:0;top:92px;width:1140px;display:flex;justify-content:space-between;align-items:center"><span class="mov">'+(tag||'Pregunta de aplicación')+'</span><b id="'+n+'_n" class="mono" style="font-size:14px"></b></div>'+
'<div id="'+n+'_q" class="wp rv abs" style="--i:3;left:0;top:132px;width:1140px;font-size:17px;font-weight:700;line-height:1.4;padding:16px 24px"></div>'+
'<div id="'+n+'_o" class="rv abs" style="--i:4;left:0;top:206px;width:1140px;display:grid;grid-template-columns:1fr 1fr;gap:10px"></div>'+
'<div id="'+n+'_f" class="abs" style="left:0;top:376px;width:1000px;min-height:64px;font-size:14px;line-height:1.5;font-weight:600"></div>'+
'<div class="abs" style="left:0;top:452px;display:flex;gap:10px"><button id="'+n+'_x" class="btn">Siguiente pregunta ›</button><button id="'+n+'_r" class="btn alt">Reiniciar</button></div></div>',
init:function(r){var q=0,ok=0,tot=0,done=false;function show(){done=false;var d=Q[q];$('#'+n+'_q',r).textContent=(q+1)+'. '+d[0];$('#'+n+'_o',r).innerHTML=d[1].map(function(o,i){return '<button class="qo" data-i="'+i+'"><b>'+'ABCD'[i]+'</b><span>'+o+'</span></button>'}).join('');$('#'+n+'_f',r).innerHTML='';$('#'+n+'_n',r).textContent='Pregunta '+(q+1)+' de '+Q.length+' · aciertos '+ok+' / '+tot;$$('.qo',r).forEach(function(b){b.onclick=function(){if(done)return;done=true;tot++;var i=+b.dataset.i,g=i===d[2];if(g)ok++;b.classList.add(g?'ok':'no');if(!g)$$('.qo',r)[d[2]].classList.add('ok');$('#'+n+'_f',r).innerHTML='<b style="color:'+(g?'#01F495':'#ffb0a6')+'">'+(g?'✔ Correcto. ':'✖ Respuesta correcta: '+'ABCD'[d[2]]+'. ')+'</b>'+d[3];$('#'+n+'_n',r).textContent='Pregunta '+(q+1)+' de '+Q.length+' · aciertos '+ok+' / '+tot}})}
$('#'+n+'_x',r).onclick=function(){if(q<Q.length-1){q++;show()}else{$('#'+n+'_f',r).innerHTML='<b style="color:#01F495">Fin del conjunto: '+ok+' de '+Q.length+' aciertos.</b> Usa «Reiniciar» para intentarlo de nuevo.'}};$('#'+n+'_r',r).onclick=function(){q=0;ok=0;tot=0;show()};show()}})}
/* lessons slide builder: items=[[titulo,texto]] */
function lessonSlide(n,t,sec,fx,eye,title,items,syn,mas){add({n:n,t:t,sec:sec,fx:fx,html:'<div class="in">'+HEAD(eye,title,1100)+
'<div class="rv abs" style="--i:2;left:0;top:92px"><span class="mov">🎬 Lecciones de Hambre de poder</span></div>'+
'<div id="'+n+'_l" class="tabs rv abs" style="--i:3;left:0;top:134px;width:420px;gap:8px"></div>'+
'<div id="'+n+'_d" class="det rv abs" style="--i:4;left:446px;top:134px;width:'+(mas?420:540)+'px;min-height:250px"></div>'+
'<div class="band rv abs" style="--i:5;left:0;top:424px;width:'+(mas?866:986)+'px;font-size:13.5px"><b>Síntesis del capítulo.</b> '+syn+'</div>'+(mas?IMG(mas,'right:20px;bottom:-30px;height:400px'):'')+'</div>',
init:function(r){mkTabs(r,'#'+n+'_l',items,1);$$('#'+n+'_l .tab',r).forEach(function(b){b.style.fontSize='13.5px';b.style.padding='12px 14px'});tabs(r,'#'+n+'_l .tab','#'+n+'_d',items,function(d){return K('Lección')+'<h3 style="font-size:20px">'+d[0]+'</h3>'+V(d[1])},1)}})}

/* 1 PORTADA */
add({n:'portada',t:'Portada',sec:'',full:1,fx:'bokeh',bg:'bg1',html:
'<img class="abs" style="left:60px;top:40px;width:230px" data-m="logo" alt="">'+IMG('m_point','right:30px;bottom:0;height:610px')+
'<div class="abs" style="left:70px;top:140px;width:700px"><div class="eye rv" style="color:#fff">Módulo Gerencia de Proyectos</div>'+
'<div class="t1 rv" style="--i:1">Gestión del alcance, tiempo y costos</div>'+
'<div class="rule rv" style="--i:2;margin:20px 0 16px;width:560px"></div>'+
'<div class="rv" style="--i:3;font-size:21px;font-weight:600;line-height:1.35;max-width:620px">Una mirada aplicada a través de la película <i>Hambre de poder</i> (The Founder)</div>'+
'<div class="chips rv" style="--i:4;margin-top:22px"><span class="chip">Alcance · Tiempo · Costos</span><span class="chip">Gantt · CPM · PERT · EVM</span></div>'+
'<div class="rv" style="--i:5;margin-top:20px;font-size:14px;font-weight:600;line-height:1.5">Maestría en Gerencia de la Innovación en Proyectos<br>Cifras de los ejercicios hipotéticas, en pesos colombianos</div></div>'+
'<div class="slog"><span>Evolucionamos para servir mejor con cercanía a</span><b>nuestros territorios</b></div>'});

/* 2 GUIA */
var RES=['Definir el alcance mediante objetivos, entregables, límites, requisitos y criterios de aceptación.','Gestionar solicitudes de cambio sin perder el control del proyecto.','Estimar duraciones y construir cronogramas con Gantt, CPM y PERT.','Identificar la ruta crítica, las holguras y las acciones de recuperación del cronograma.','Estimar costos, construir un presupuesto y controlar desviaciones.','Interpretar indicadores de valor ganado y utilizarlos para tomar decisiones.','Analizar las decisiones de la historia de McDonald’s desde una perspectiva técnica, estratégica y ética.'];
add({n:'guia',t:'Cómo usar la guía',sec:'Presentación',fx:'dots',html:'<div class="in">'+HEAD('Cómo utilizar esta guía','Estudiar conceptos y desarrollar criterio gerencial',1100)+

lessonSlide('lec-alcance','Lecciones: alcance','1 · Alcance','radar','1.8 · Lecciones de Hambre de poder aplicadas al alcance','Concepto claro, replicable y con acuerdos claros',[['Un concepto claro puede ser más valioso que una oferta dispersa','Los hermanos McDonald simplificaron el menú y rediseñaron el servicio para concentrarse en pocos productos y en una operación rápida y consistente. Desde el alcance, es priorización: definir qué valor se quiere entregar y evitar complejidad que no contribuya al objetivo.'],['Replicar no significa copiar sin adaptar','La expansión por franquicias exigía especificar procesos, estándares y responsabilidades. Un alcance replicable define qué es obligatorio y qué puede adaptarse al contexto local, sin debilitar la propuesta central.'],['Los cambios tienen implicaciones contractuales y éticas','La película presenta tensiones entre los hermanos y Kroc sobre el control y el futuro del negocio. Los acuerdos, derechos, responsabilidades y cambios de propiedad deben quedar claros y documentados: una oportunidad de negocio no elimina la obligación de respetar compromisos.']],'Un alcance sólido define el valor esperado, convierte necesidades en entregables verificables, descompone el trabajo y establece reglas para controlar los cambios. Sin alcance claro, el cronograma y el presupuesto se construyen sobre supuestos inestables.');

lessonSlide('lec-tiempo','Lecciones: tiempo',SEC2,'orbit','2.9 · Lecciones de Hambre de poder aplicadas al tiempo','La velocidad nace del diseño, no de la presión',[['La velocidad nace del diseño del proceso','El Speedee Service System no se limitó a pedirle al personal que trabajara más rápido. Rediseñó el flujo, simplificó tareas y especializó funciones. Mejorar tiempos requiere revisar la secuencia y el método de trabajo, no solo exigir mayor esfuerzo.'],['La expansión exige sincronizar actividades','Abrir nuevos restaurantes requiere coordinar ubicación, diseño, permisos, adecuación, equipos, contratación y capacitación. Una demora en una dependencia puede afectar la fecha de apertura. El Gantt comunica el plan y CPM identifica qué secuencia determina la duración.'],['La rapidez no debe destruir la calidad','La presión por crecer puede llevar a acelerar decisiones sin verificar capacidades. Cualquier compresión del cronograma debe analizar el efecto sobre calidad, seguridad, experiencia del cliente y riesgos.']],'El cronograma debe representar la lógica del trabajo y no una fecha deseada. Estimar con datos, visualizar dependencias, identificar la ruta crítica y monitorear desviaciones permite anticipar retrasos y decidir con fundamento.');

quizSlide('quiz-tiempo','Quiz: tiempo',SEC2,'tri','Preguntas de aplicación · Gestión del tiempo','Pon a prueba el cronograma',[['¿Qué aspecto del Speedee Service System se relaciona con la mejora de la duración de un proceso?',['Aumentar tareas simultáneas sin orden.','Rediseñar el flujo y estandarizar actividades.','Eliminar toda capacitación.','Evitar medir tiempos.'],1,'El rediseño del proceso reduce esperas y movimientos innecesarios; no se trata solo de trabajar más rápido.'],['Para coordinar diseño, permisos, obra, equipos y capacitación en la apertura de un local, ¿qué herramienta facilita visualizar fechas y solapamientos?',['Diagrama de Gantt.','Matriz de interesados.','Análisis FODA.','Matriz de calidad.'],0,'El Gantt representa actividades, duración y calendario, facilitando la coordinación.'],['Si una demora en la capacitación retrasa la apertura porque es parte de la ruta crítica, ¿qué debe analizar el director?',['Solo el costo de publicidad.','Cambiar el nombre del hito.','Acelerar o reorganizar la actividad crítica con análisis de riesgos.','Eliminar la prueba final.'],2,'La actividad crítica afecta la fecha final; cualquier aceleración debe considerar recursos, calidad y riesgos.'],['Una nueva franquicia solicita abrir antes de la fecha prevista. ¿Qué técnica puede reducir la duración añadiendo recursos a una actividad crítica?',['Fast tracking.','Crashing.','Análisis de requisitos.','Auditoría de calidad.'],1,'Crashing añade recursos o inversión para reducir duración, aunque puede incrementar costos.']]);

lessonSlide('lec-costos','Lecciones: costos',SEC3,'hex','3.10 · Lecciones de Hambre de poder aplicadas a costos','Estandarizar, entender el modelo y gobernar decisiones',[['La estandarización puede reducir desperdicios y variabilidad','Un proceso repetible facilita estimar cantidades, tiempos, compras y necesidades de personal. En costos, la estandarización mejora el control de insumos y reduce errores, aunque debe vigilarse que no sacrifique adaptación ni calidad.'],['Crecer exige entender el modelo económico','La expansión por franquicias implica evaluar ingresos, costos de operación, inversión, contratos, proveedores y capacidad de soporte. Una apertura no debe basarse solo en entusiasmo comercial: requiere escenarios financieros y análisis de sostenibilidad.'],['El control financiero también es control de decisiones','La película muestra negociaciones y cambios en la forma de capturar valor del negocio. Hay que evaluar quién asume los costos, quién recibe los beneficios, qué riesgos se transfieren y qué obligaciones se mantienen.']],'Un presupuesto útil nace de un alcance claro y de estimaciones justificadas. El control compara el trabajo logrado con lo gastado y el plan aprobado. EVM convierte los datos en señales para decidir, pero la interpretación debe considerar causas y consecuencias.');

quizSlide('quiz-costos','Quiz: costos',SEC3,'comet','Preguntas de aplicación · Gestión de costos','Pon a prueba los costos y el EVM',[['¿Qué práctica se relaciona con el control de costos al replicar el modelo operativo de McDonald’s?',['Cambiar procesos en cada local.','Estandarizar actividades y controlar desperdicios.','Evitar registrar costos.','Comprar sin comparar proveedores.'],1,'La estandarización facilita planear consumos, reducir variaciones y controlar el costo de operación.'],['Un nuevo local presenta CPI = 0,82. ¿Qué significa?',['Se obtiene $0,82 de valor por cada peso gastado.','El proyecto está adelantado.','El presupuesto no tiene variación.','Se ha completado el 82 % del alcance total.'],0,'CPI = EV/AC; un valor inferior a 1 indica que el costo real supera el valor ganado.'],['Si Kroc quisiera evaluar si abrir una nueva franquicia es financieramente viable, ¿qué decisión sería más sólida?',['Abrirla por presión comercial.','Usar solo el costo de construcción.','Evaluar inversión, operación, ingresos, riesgos y escenarios.','Copiar el presupuesto de cualquier local.'],2,'La decisión requiere una evaluación integral del ciclo de vida y de los riesgos económicos.'],['En un proyecto con PV = $300 millones, EV = $270 millones y AC = $315 millones, ¿cuál es la conclusión correcta?',['CPI y SPI son mayores que 1.','Está adelantado y bajo presupuesto.','No hay desviaciones.','Está retrasado y presenta sobrecosto.'],3,'SPI = 0,90 y CPI ≈ 0,86; ambos indicadores están por debajo de 1.']]);

tabSlide({n:'integracion',t:'Integración de las tres dimensiones',sec:SEC4,fx:'orbit',eye:'4 · Integración: alcance, tiempo y costos',title:'Tres dimensiones, un solo sistema',
intro:'Si se agregan entregables, puede aumentar la duración y el costo. Si se reduce el tiempo, quizá se requieran más recursos o aumenten los riesgos. Si se reduce el presupuesto, puede ser necesario priorizar el alcance o replantear la solución.',
data:[['Agregar una funcionalidad','Aumenta el trabajo y los entregables.','Puede extender la duración.','Puede aumentar diseño, pruebas y soporte.'],['Acelerar una actividad crítica','Puede mantener entregables.','Reduce duración si la acción funciona.','Puede requerir horas extra o más recursos.'],['Reducir presupuesto','Puede exigir priorización o reducción aprobada.','Puede extender el plazo.','Reduce gasto planificado, pero puede aumentar riesgos.'],['Cambiar proveedor','Puede alterar especificaciones y aceptación.','Puede generar transición y demoras.','Puede cambiar tarifas, garantías y costos de cambio.']],labels:['Efecto posible en el alcance','Efecto posible en el tiempo','Efecto posible en los costos'],top:160,mh:270,mas:0});

tabSlide({n:'caso',t:'Caso integrador',sec:SEC4,fx:'radar',eye:'Caso integrador · apertura de un restaurante de servicio rápido',title:'Semana 10: tres situaciones, una decisión',
intro:'Abrir un restaurante en una ciudad colombiana en <b>19 semanas</b>, con línea base de <b>$475 millones</b> (adecuación, equipos, tecnología, contratación, capacitación, pruebas y apertura). Durante la semana 10 se presentan tres situaciones. Elige una y analízala.',
data:[['El proveedor anuncia una demora de 2 semanas en los equipos','¿La instalación está en ruta crítica? ¿Hay alternativa de proveedor? ¿Qué costo tiene acelerar?','Comparar alternativas y actualizar el pronóstico del cronograma.'],['El cliente interno pide un nuevo canal de pedidos no incluido','¿Qué valor aporta? ¿Qué requisitos, pruebas, tiempo y costos genera?','Tramitar el cambio y aprobarlo solo con impactos conocidos.'],['Los costos de adecuación superan la estimación en 12 %','¿Qué partidas explican la variación? ¿Se consumió contingencia? ¿Qué pronóstico resulta?','Revisar costos reales, compromisos, reservas y EAC.']],labels:['Análisis requerido','Decisión esperada'],top:170,mh:220,
note:'<b>Regla para decidir.</b> No aceptar un cambio solo porque parece atractivo; no acelerar una actividad sin revisar riesgos; no recortar costos sin valorar la calidad. La decisión debe mostrar el impacto integrado en alcance, tiempo, costos, riesgos y beneficios.',nt:410});

quizSlide('repaso','Banco de repaso','Repaso','squares','Banco adicional de preguntas de repaso','Diez preguntas para los tres capítulos',[['¿Cuál es la función principal de la EDT?',['Mostrar únicamente fechas de inicio.','Descomponer el alcance total en componentes manejables.','Calcular el costo real automáticamente.','Sustituir la declaración de alcance.'],1,'La EDT organiza el trabajo total en niveles y paquetes que se pueden estimar y controlar.'],['¿Qué diferencia existe entre validar el alcance y controlar el alcance?',['Son exactamente lo mismo.','Validar es estimar costos y controlar es contratar.','Validar obtiene aceptación de entregables; controlar gestiona cambios y desviaciones.','Controlar consiste en aumentar el alcance.'],2,'La validación se centra en la aceptación; el control supervisa el alcance y gestiona cambios.'],['¿Qué método de estimación utiliza escenarios optimista, más probable y pesimista?',['PERT / tres puntos.','Análisis de interesados.','Matriz RACI.','Diagrama de afinidad.'],0,'La estimación de tres puntos incorpora incertidumbre mediante tres escenarios.'],['¿Qué representa la ruta crítica?',['La actividad de mayor costo.','El camino con más personas asignadas.','La lista de riesgos de mayor impacto.','La secuencia de mayor duración que determina la fecha mínima del proyecto.'],3,'La ruta crítica determina la duración calculada del proyecto bajo las relaciones y duraciones del modelo.'],['¿Qué acción es un ejemplo de fast tracking?',['Aumentar el número de inspectores.','Ejecutar en paralelo actividades que estaban planificadas en secuencia.','Aplazar todas las compras.','Reducir el presupuesto sin análisis.'],1,'Fast tracking solapa actividades, lo que puede reducir tiempo, pero elevar el riesgo de retrabajo.'],['¿Qué representa el valor ganado (EV)?',['El dinero pagado a proveedores.','El presupuesto total aprobado.','El valor presupuestado del trabajo realmente completado.','El costo previsto para el próximo mes.'],2,'EV mide el valor presupuestado del trabajo ejecutado, no el dinero gastado.'],['Si CPI = 1,10, ¿qué indica el resultado?',['El proyecto está retrasado.','Se obtiene $1,10 de valor por cada peso de costo real.','El proyecto gastó 110 % del presupuesto total.','No existe información suficiente para calcularlo.'],1,'Un CPI superior a 1 refleja eficiencia favorable de costos respecto al valor ganado.'],['¿Por qué no se debe aprobar un cambio de alcance sin análisis?',['Porque todos los cambios son negativos.','Porque el cliente no puede solicitar cambios.','Porque el cambio siempre cancela el proyecto.','Porque puede afectar tiempo, costo, calidad, riesgos y beneficios.'],3,'El cambio puede ser valioso, pero sus impactos deben conocerse y aprobarse antes de implementarlo.'],['¿Qué enseñanza de la película puede relacionarse con la estandarización?',['Cada local debe inventar su propio proceso.','La consistencia puede facilitar la replicación y el control.','Los procesos no necesitan capacitación.','La rapidez depende solo de trabajar más horas.'],1,'Un proceso estandarizado facilita la repetibilidad, la capacitación y el control operativo.'],['¿Qué postura refleja una gestión ética de los acuerdos de negocio?',['Cambiar condiciones sin informar.','Ocultar información para negociar mejor.','Documentar responsabilidades y respetar compromisos.','Priorizar el resultado económico sobre cualquier obligación.'],2,'La sostenibilidad del proyecto también depende de confianza, transparencia y cumplimiento de acuerdos.']],'Repaso integrador');

var GLO=[['Alcance','Trabajo y entregables incluidos en el proyecto.'],['Línea base','Versión aprobada del alcance, cronograma o costos utilizada para comparar el desempeño.'],['EDT/WBS','Estructura jerárquica que descompone el trabajo total.'],['Paquete de trabajo','Componente de la EDT que puede estimarse, asignarse y controlarse.'],['Criterio de aceptación','Condición verificable para aceptar un entregable.'],['Scope creep','Crecimiento no controlado del alcance.'],['Hito','Punto significativo de control sin duración.'],['Dependencia','Relación lógica entre actividades.'],['Holgura','Margen de tiempo disponible sin afectar una fecha o hito definido.'],['Ruta crítica','Secuencia de mayor duración que determina la duración del proyecto.'],['Gantt','Representación de actividades sobre una escala temporal.'],['PERT','Técnica de estimación de duración mediante tres valores.'],['Crashing','Aceleración mediante recursos adicionales o mayor inversión.'],['Fast tracking','Solapamiento de actividades originalmente secuenciales.'],['Costo directo','Costo atribuible a una actividad o entregable.'],['Costo indirecto','Costo de soporte que no se atribuye fácilmente a un solo entregable.'],['Contingencia','Reserva para respuestas a riesgos identificados.'],['PV','Valor planificado a la fecha de corte.'],['EV','Valor presupuestado del trabajo efectivamente completado.'],['AC','Costo real incurrido.'],['BAC','Presupuesto aprobado al concluir.'],['CPI','Índice de desempeño de costos: EV dividido entre AC.'],['SPI','Índice de desempeño del cronograma: EV dividido entre PV.'],['EAC','Estimación del costo total al concluir.'],['VAC','Diferencia entre el presupuesto al concluir y la estimación al concluir.']];

tabSlide({n:'conclusiones',t:'Conclusiones',sec:'Cierre',fx:'chev',eye:'Conclusiones: lo que deja la historia de McDonald’s',title:'Cinco ideas para llevarse',
data:[['El alcance enfoca','Un modelo de negocio necesita definir qué valor entrega y qué trabajo es necesario para producirlo.'],['El tiempo se diseña','La velocidad sostenible proviene de procesos, secuencias y coordinación, no solamente de presión sobre las personas.'],['Los costos se gobiernan','Estimar, presupuestar y medir permite anticipar desviaciones y proteger la viabilidad.'],['Las herramientas no sustituyen el juicio','Gantt, CPM, PERT y EVM aportan evidencia, pero las decisiones deben considerar contexto, riesgos y calidad.'],['La ética es parte de la gestión','El crecimiento no elimina la responsabilidad de respetar acuerdos, reconocer contribuciones y actuar con transparencia.']],labels:['Conclusión'],num:1,top:100,mh:260,
note:'<b>Pregunta final de reflexión.</b> Si tuvieras que liderar la expansión de un negocio como el que muestra <i>Hambre de poder</i>, ¿qué decisión priorizarías para crecer sin perder el control del alcance, el tiempo, los costos y la confianza de las personas involucradas?',nc:'warn',nt:420});
