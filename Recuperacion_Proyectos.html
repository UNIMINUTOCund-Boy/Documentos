table.t{border-collapse:separate;border-spacing:0 6px;width:100%}

input[type=range]{accent-color:#00a86b;height:22px}

.mono{font-variant-numeric:tabular-nums}
/* gantt */

.gr0{display:grid;grid-template-columns:240px 1fr;align-items:center;height:32px;border-bottom:1px solid var(--line)}
.gr0 .lb{font-weight:700;font-size:12px;white-space:nowrap;line-height:1.2;padding-right:8px;text-align:left}
.gr0 .lb small{display:none;font-weight:500;color:var(--mut);font-size:11px}
.gr0 .tr{position:relative;height:32px;background:repeating-linear-gradient(90deg,transparent 0,transparent 49px,var(--line) 49px,var(--line) 50px)}
.gb{position:absolute;top:5px;height:22px;border-radius:7px;background:var(--g2);transition:left .5s,width .5s,background .3s;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;padding-left:7px;white-space:nowrap}
.gb.cr{background:var(--g3);outline:3px solid var(--yel)}
.gb.sel{box-shadow:0 0 0 3px var(--blue)}
.gs{position:absolute;top:8px;height:22px;border-radius:0 7px 7px 0;border:2px dashed var(--g2);border-left:0;transition:.5s}
/* meters */
.mt{height:10px;border-radius:6px;background:var(--mint);overflow:hidden}
.mt i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g1));border-radius:6px;transition:width .5s}
.flip{perspective:900px;height:156px}
.flip>div{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.on2>div{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:14px 16px;text-align:left}
.flip .f{background:var(--mint2);border:2px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}
.flip .f b{font-size:15.5px;line-height:1.25;font-weight:800}
.flip .f span{font-size:12px;font-weight:700;color:var(--g2)}
.flip .b{background:linear-gradient(160deg,var(--g2),var(--g1));color:#fff;transform:rotateY(180deg);font-size:12.5px;line-height:1.4;font-weight:600;overflow:hidden}
.flip .b b{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;opacity:.85;margin-top:5px}
.flip .b b:first-child{margin-top:0}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.on .rv{animation:none}}

<script>

var LOGO='<img class="lgo" data-m="logo" alt="">';

/* 1 PORTADA */
add({n:'portada',t:'Portada',sec:0,full:1,fx:'net',html:'<div class="ph" data-bg="bg"></div><div class="gr"></div><!--cv-->'+
'<div class="ycir" style="width:520px;height:520px;left:-120px;bottom:-240px"></div>'+
'<img class="lgo" style="left:46px;top:34px" data-m="logo" alt="">'+IMG('m_hip','left:50px;bottom:0;height:560px')+
'<div class="abs" style="left:440px;top:112px;width:790px"><div class="eye rv" style="color:#fff;opacity:.95">Gerencia de Proyectos · Material de apoyo</div>'+
'<div class="t1 rv" style="--i:1">Recuperación de proyectos en crisis</div>'+
'<div class="rv" style="height:2px;background:rgba(255,255,255,.6);margin:18px 0 14px;width:600px"></div>'+
'<div class="rv" style="--i:3;font-size:22px;font-weight:600;line-height:1.3;max-width:640px">Guía conceptual, técnica y aplicada para analizar el caso SmartWater IoT</div>'+
'<div class="chips rv" style="--i:4"><span class="chip">Caso: ONG Agua para Todos</span><span class="chip">EVM · Gantt · Plan de recuperación</span></div>'+
'<div class="rv" style="--i:5;margin-top:22px;font-size:14.5px;font-weight:600;line-height:1.5">Módulo Gerencia de Proyectos<br>Maestría en Gerencia de la Innovación en Proyectos · Octubre de 2026</div></div>'+
'<div class="slog"><span>Evolucionamos para servir mejor con cercanía a</span><b>nuestros territorios</b></div>',
init:function(r){$('.ph',r).style.backgroundImage='url('+IM.bg+')'}});

/* 2 PROPOSITO */
var RES=['Diagnosticar desviaciones de alcance, cronograma, costos, calidad y desempeño del equipo.','Interpretar un cronograma mediante hitos, dependencias, holguras y ruta crítica.','Calcular e interpretar PV, EV, AC, CV, SV, CPI y SPI.','Elaborar pronósticos de costo y evaluar escenarios de recuperación.','Proponer ajustes de recursos, secuencia, contratación, comunicación y control.','Defender una hipótesis de recuperación con evidencia, supuestos explícitos y criterios de éxito.'];
add({n:'proposito',t:'Propósito y aprendizajes',sec:1,fx:'dots',html:'<div class="in">'+HEAD('Presentación de la guía','Recuperar un proyecto es decidir con evidencia',620)+
'<p class="lead rv" style="--i:2;max-width:610px;font-size:15px">Una crisis aparece cuando la diferencia entre lo prometido y lo real amenaza resultados, presupuesto, plazo, calidad o legitimidad. Recuperar no es acelerar a cualquier costo: es reconocer la realidad, entender las causas, decidir qué valor proteger y construir un plan ejecutable.</p>'+
'<div class="eye rv" style="--i:3;position:absolute;left:0;top:206px;margin:0">Resultados de aprendizaje · marca los que ya dominas</div>'+
'<div id="p2r" class="rv" style="--i:4;position:absolute;left:-12px;top:230px;width:640px;display:grid;grid-template-columns:1fr 1fr;gap:2px 8px"></div>'+
'<div class="rv" style="--i:5;position:absolute;left:0;top:488px;width:620px;display:flex;align-items:center;gap:14px"><div class="mt" style="flex:1"><i id="p2b" style="width:0"></i></div><b id="p2n" class="mono" style="font-size:15px;min-width:92px">0 de 6</b></div>'+
'<div class="warn rv" style="--i:6;position:absolute;left:0;top:520px;width:620px;font-size:12.5px;padding:9px 14px"><b>Importante:</b> las cifras de los ejemplos son didácticas. Para el caso real se usan los datos del anexo «Proyecto con desviaciones».</div>'+
IMG('m_wave','right:-14px;top:-6px;height:560px')+'</div>',
init:function(r){var g=$('#p2r',r),st=[];RES.forEach(function(t,i){st.push(0);var b=document.createElement('button');b.className='ck';b.innerHTML='<i>✓</i><span>'+t+'</span>';b.onclick=function(){st[i]^=1;b.classList.toggle('on2',!!st[i]);var n=st.reduce(function(a,c){return a+c},0);$('#p2n',r).textContent=n+' de 6';$('#p2b',r).style.width=(n/6*100)+'%'};g.appendChild(b)})}});

/* 3 RUTA */
var RUTA=[['Antes de analizar','Leer el caso completo; extraer fechas, presupuesto, entregables, avance, gastos, riesgos y decisiones previas.','Ficha de datos y preguntas pendientes.'],['Fase 1 · Diagnóstico','Comparar plan vs. realidad, identificar causas y efectos, revisar cada fase y entregable.','Matriz de desviaciones y causas.'],['Fase 2 · Hipótesis','Consultar fuentes, evaluar alternativas y justificar la estrategia de recuperación.','Hipótesis sustentada y escenarios.'],['Fase 3 · Solución','Construir Gantt de recuperación, reasignar recursos y diseñar controles.','Plan de recuperación y tablero EVM.'],['Evidencia','Sintetizar el análisis en 10–15 diapositivas, con visualizaciones y referencias APA 7.','Presentación ejecutiva.']];
add({n:'ruta',t:'Ruta de la guía',sec:1,fx:'stripes',html:'<div class="in">'+HEAD('Cómo utilizar esta guía','Cinco momentos, cada uno con su producto',700)+
'<div id="p3t" class="abs rv" style="--i:2;left:0;top:140px;width:760px;height:110px"><div style="position:absolute;left:30px;right:30px;top:34px;height:8px;border-radius:6px;background:var(--mint)"></div><div id="p3f" style="position:absolute;left:30px;top:34px;height:8px;border-radius:6px;background:linear-gradient(90deg,var(--g2),var(--g1));transition:width .5s"></div></div>'+
'<div id="p3d" class="det rv abs" style="--i:4;left:0;top:268px;width:700px;min-height:230px"></div>'+
'<div class="band rv abs" style="--i:5;left:0;top:512px;width:700px;font-size:13px;padding:9px 16px">Cada fase termina en un entregable concreto: no se avanza sin el producto de la fase anterior.</div>'+
IMG('m_point','right:-40px;top:20px;height:560px')+'</div>',
init:function(r){var t=$('#p3t',r),bs=[];RUTA.forEach(function(x,i){var b=document.createElement('button');b.className='tab';b.style.cssText='position:absolute;top:0;left:'+(i*(700/4))+'px;width:60px;height:76px;flex-direction:column;border:0;background:none;padding:0;display:block;text-align:center';b.innerHTML='<span class="dotn" style="display:grid;place-items:center;width:44px;height:44px;margin:12px auto 0;border-radius:50%;background:#fff;border:4px solid var(--g1);font-weight:800;font-size:16px;transition:.3s">'+(i+1)+'</span><span style="display:block;margin-top:8px;font-size:12px;font-weight:700;line-height:1.15;width:110px;margin-left:-25px">'+x[0]+'</span>';b.onclick=b.onmouseenter=function(){bs.forEach(function(q,k){var d=$('.dotn',q);d.style.background=k<=i?'var(--g3)':'#fff';d.style.color=k<=i?'#fff':'var(--ink)';d.style.borderColor=k<=i?'var(--g3)':'var(--g1)';d.style.transform=k===i?'scale(1.2)':'none'});$('#p3f',r).style.width=(i/4*700)+'px';$('#p3d',r).innerHTML='<div class="k" style="font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#17483a">'+x[0]+'</div><h3 style="margin:6px 0 10px;font-size:24px;font-weight:800">Qué debe hacer el estudiante</h3><p>'+x[1]+'</p><span class="k" style="display:block;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#17483a;margin-top:12px">Producto de trabajo</span><span style="font-size:17px;font-weight:800;line-height:1.3">'+x[2]+'</span>'};t.appendChild(b);bs.push(b)});bs[0].onclick()}});

/* 4 SEÑALES */
var SEN=[['Hitos incumplidos repetidamente','Estimaciones débiles, dependencias no gestionadas o capacidad insuficiente.','¿Qué actividad está bloqueando la ruta crítica?'],['Costo real superior al valor del trabajo logrado','Ineficiencia, reprocesos, compras urgentes o productividad menor.','¿Qué está consumiendo el presupuesto sin producir entregables aceptados?'],['Avance reportado sin evidencia','Medición subjetiva o criterios de aceptación ambiguos.','¿Cómo se demuestra el porcentaje de avance?'],['Cambios frecuentes de alcance','Requisitos incompletos, solicitudes no controladas o expectativas distintas.','¿Qué cambio fue aprobado, por quién y con qué impacto?'],['Conflictos con proveedores o cliente','Contratos, responsabilidades o comunicación deficientes.','¿Qué compromisos deben renegociarse y documentarse?'],['Pruebas fallidas o defectos recurrentes','Diseño inestable, integración prematura o control de calidad insuficiente.','¿Conviene estabilizar antes de seguir agregando funciones?']];
