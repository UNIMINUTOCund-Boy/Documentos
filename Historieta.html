<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sentinel · Libro interactivo de Gerencia de Proyectos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --g1:#0B4AD3;--g2:#0A3FB8;--g3:#072C86;
  --navy:#052570;--ink:#0B1F55;--paper:#FFFBF0;--paper2:#F4EEDC;--yellow:#FFC20E;--royal:#0A43C4;--sky:#7DB4FF;--coral:#FF6B5B;--ok:#16A34A;--bad:#E5484D;
  --disp:'Bangers','Impact',system-ui,sans-serif;--head:'Montserrat',system-ui,sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--comic:'Comic Neue','Comic Sans MS',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background:linear-gradient(160deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%);transition:background .6s;overflow:hidden;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;transition:opacity .35s}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:8px}

.app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;align-items:center;padding:10px 12px 8px;gap:8px}
.hdr{width:min(1020px,100%);display:flex;align-items:center;gap:8px;color:#fff}
.hdr .brand{font:400 22px var(--disp);letter-spacing:.08em;color:var(--yellow);text-shadow:2px 2px 0 var(--navy);margin-right:auto;white-space:nowrap}
.chip{background:rgba(5,37,112,.78);color:#fff;border:1.5px solid rgba(255,255,255,.3);border-radius:99px;padding:8px 14px;font:700 12.5px var(--head);display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(4px);white-space:nowrap}
button.chip:hover{border-color:var(--yellow);color:var(--yellow)}
.chip.who{max-width:34vw;overflow:hidden;text-overflow:ellipsis}

.book{position:relative;width:min(1020px,100%);flex:1;min-height:0;perspective:2400px}
.book::before{content:"";position:absolute;inset:6px -7px -7px 7px;border-radius:14px;background:repeating-linear-gradient(90deg,#EDE6D2 0 2px,#fff 2px 4px);box-shadow:0 22px 50px rgba(0,0,0,.35)}
.leaf{position:absolute;inset:0;border-radius:12px 16px 16px 12px;background:var(--paper);border:3px solid var(--navy);box-shadow:inset 22px 0 26px -18px rgba(5,37,112,.35);overflow:hidden;display:flex;flex-direction:column;transform-origin:left center;backface-visibility:hidden}
.leaf.under{z-index:1}
.leaf.top{z-index:3}
.leaf.turn-out{z-index:4;animation:turnOut .85s cubic-bezier(.55,.05,.35,1) forwards}
.leaf.turn-in{z-index:4;animation:turnIn .85s cubic-bezier(.55,.05,.35,1) both}
@keyframes turnOut{0%{transform:rotateY(0);box-shadow:inset 22px 0 26px -18px rgba(5,37,112,.35)}60%{opacity:1}100%{transform:rotateY(-112deg);opacity:0;box-shadow:-20px 0 40px rgba(0,0,0,.5)}}
@keyframes turnIn{0%{transform:rotateY(-112deg);opacity:0}40%{opacity:1}100%{transform:rotateY(0);opacity:1}}
.pg{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:22px 26px 20px 36px;scrollbar-width:thin}
.pgfoot{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 8px 34px;font:700 11px var(--head);letter-spacing:.12em;text-transform:uppercase;color:#6B7BA8;border-top:2px dashed #E0D8BC;flex:none}

.nav{width:min(1020px,100%);display:flex;align-items:center;gap:10px}
.nb{background:var(--yellow);color:var(--navy);font:800 14px var(--head);padding:12px 20px;border-radius:12px;box-shadow:0 4px 0 #B98A00;transition:transform .12s,box-shadow .12s,opacity .2s;white-space:nowrap}
.nb:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 #B98A00}
.nb:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #B98A00}
.nb:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.nb.ghost{background:rgba(5,37,112,.8);color:#fff;box-shadow:none;border:1.5px solid rgba(255,255,255,.3)}
.prog{flex:1;display:flex;gap:4px;align-items:center;justify-content:center}
.prog i{flex:1;max-width:44px;height:8px;border-radius:99px;background:rgba(255,255,255,.28);position:relative;overflow:hidden}
.prog i b{position:absolute;inset:0;width:0;background:var(--yellow);transition:width .5s}
.hintline{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%)}
.gate{font:700 12px var(--head);color:#fff;text-align:center;min-height:16px;opacity:.9;width:min(1020px,100%)}

/* ── tipografías de página ── */
.ribbon{display:inline-block;background:var(--navy);color:var(--yellow);font:800 12px var(--head);letter-spacing:.14em;text-transform:uppercase;padding:6px 14px;transform:skewX(-8deg);border-radius:4px}
.ribbon span{display:inline-block;transform:skewX(8deg)}
.ttl{font:800 clamp(24px,4.2vw,38px)/1.05 var(--head);color:var(--navy);letter-spacing:-.02em;margin:10px 0 6px;position:relative;padding-left:18px}
.ttl::before{content:"";position:absolute;left:0;top:.06em;bottom:.06em;width:10px;background:var(--yellow);border-radius:3px;transform:skewX(-8deg)}
.lede{color:#33447A;font-size:15px;line-height:1.55;max-width:70ch}
.sfx{position:relative;display:block;text-align:right;line-height:1;margin:-2px 2px 4px auto;width:max-content;max-width:100%;font:400 clamp(20px,3vw,30px) var(--disp);letter-spacing:.06em;color:var(--yellow);-webkit-text-stroke:1.5px var(--navy);paint-order:stroke fill;text-shadow:3px 3px 0 var(--navy);transform:rotate(-5deg);z-index:5;opacity:0}
.in .sfx{animation:sfxPop .5s .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes sfxPop{from{opacity:0;transform:scale(.2) rotate(-25deg)}to{opacity:1;transform:scale(1) rotate(-5deg)}}

/* ── portada ── */
.cover{background:linear-gradient(150deg,#0B4AD3,#072C86);color:#fff;border-color:#031A52;position:relative}
.cover .pg{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:26px 28px 26px 44px;position:relative;z-index:2}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:34px;background:linear-gradient(90deg,#031A52,#072C86 70%,rgba(0,0,0,0));z-index:3}
.cover .blk{position:absolute;z-index:1;border-radius:14px;opacity:.9}
.cover .tagc{background:var(--yellow);color:var(--navy);font:800 12px var(--head);letter-spacing:.16em;text-transform:uppercase;padding:7px 16px;transform:skewX(-8deg);border-radius:4px}
.cover h1{font:400 clamp(54px,12vw,120px)/.9 var(--disp);letter-spacing:.06em;color:#fff;text-shadow:5px 5px 0 var(--navy),0 0 40px rgba(255,194,14,.35);-webkit-text-stroke:2px var(--navy)}
.cover h1 em{font-style:normal;color:var(--yellow)}
.cover .sub{font:700 clamp(15px,2.4vw,20px)/1.35 var(--head);max-width:30ch;color:#E3EDFF}
.cover .cast{display:flex;gap:0;justify-content:center;margin:2px 0}
.cover .cast .cw2{width:clamp(56px,11vw,92px);margin:0 -6px}
.cover .cast .cw2 .chr{width:100%;height:auto;display:block}
.cover label{font:700 11.5px var(--head);letter-spacing:.18em;text-transform:uppercase;color:var(--yellow)}
.cover input{width:min(420px,86vw);background:rgba(3,26,82,.7);border:2px solid rgba(255,255,255,.4);border-radius:12px;padding:14px 16px;color:#fff;font:700 18px var(--head);text-align:center}
.cover input:focus{outline:none;border-color:var(--yellow);box-shadow:0 0 0 3px rgba(255,194,14,.25)}
.cover input::placeholder{color:#9DB8F2;font-weight:600}
.cover .small{font-size:12px;color:#C9DAFF;max-width:60ch;line-height:1.5}
.resumebox{display:none;gap:8px;flex-direction:column;align-items:center}

/* ── reparto ── */
.cast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:16px}
.cc{background:#fff;border:3px solid var(--navy);border-radius:16px;box-shadow:5px 5px 0 var(--navy);padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;opacity:0;transform:translateY(16px) rotate(-1deg);transition:transform .2s}
.in .cc{animation:ccIn .5s cubic-bezier(.2,1.2,.4,1) forwards}
@keyframes ccIn{to{opacity:1;transform:none}}
.cc:hover{transform:translateY(-4px) rotate(.4deg)}
.cc .av{height:130px;border-radius:10px;display:flex;justify-content:center;align-items:flex-end;overflow:hidden;position:relative}
.cc .av .chr{height:120px;width:auto}
.cc h3{font:800 17px var(--head);color:var(--navy);line-height:1.1}
.cc .role{font:700 12px var(--head);color:var(--royal);text-transform:uppercase;letter-spacing:.06em}
.cc p{font-size:13.5px;line-height:1.5;color:#33447A}
.cc .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.cc .tags span{background:#E7F0FF;border:1.5px solid #B9D1FF;color:var(--navy);font:700 11px var(--head);padding:4px 9px;border-radius:99px}
.cc .tags span.ar{background:var(--yellow);border-color:var(--navy)}

/* ── personajes animados ── */
.chr{display:block;overflow:visible}
.chr.flip{transform:scaleX(-1)}
.chr .body{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.chr .eye{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
.chr .sweat{animation:sweat 1.6s infinite}
.chr .prop{animation:wob 1.8s ease-in-out infinite;transform-origin:70% 90%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px) scaleY(1.01)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes sweat{0%{transform:translateY(0);opacity:1}100%{transform:translateY(12px);opacity:0}}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}

/* ── historieta ── */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.panel{position:relative;border:3px solid var(--navy);border-radius:8px;background:#fff;box-shadow:5px 5px 0 var(--navy);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:scale(.82) rotate(var(--rot,0deg))}
.panel.in{animation:panelPop .55s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes panelPop{to{opacity:1;transform:scale(1) rotate(var(--rot,0deg))}}
.panel .cap{background:var(--yellow);color:var(--navy);font:800 12px/1.35 var(--head);padding:7px 10px;border-bottom:3px solid var(--navy);letter-spacing:.01em}
.scene{position:relative;flex:1;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;padding:10px 10px 0;background-image:radial-gradient(rgba(5,37,112,.09) 1.2px,transparent 1.4px);background-size:9px 9px}
.bg-office{background-color:#DCE9FF}.bg-warm{background-color:#FFE8A8}.bg-night{background-color:#6C8DE0}.bg-alert{background-color:#FFD6CC}.bg-purple{background-color:#E3DBFF}.bg-green{background-color:#CFF2DE}
.bub{position:relative;z-index:3;max-width:88%;background:#fff;border:2.5px solid var(--navy);border-radius:16px;padding:8px 12px;font:700 14px/1.35 var(--comic);color:var(--navy);margin-bottom:12px;opacity:0;transform:scale(.6);transform-origin:var(--to,30% 100%)}
.in .bub{animation:bubPop .4s calc(.35s + var(--d,0s)) cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes bubPop{to{opacity:1;transform:scale(1)}}
.bub::after{content:"";position:absolute;bottom:-11px;left:var(--tl,26%);width:16px;height:16px;background:#fff;border-right:2.5px solid var(--navy);border-bottom:2.5px solid var(--navy);transform:rotate(45deg) skew(10deg,10deg)}
.bub.r{align-self:flex-end}
.bub.l{align-self:flex-start}
.chrow{position:relative;height:108px;flex:none;z-index:2}
.cw{position:absolute;bottom:0;width:78px;transform:translateX(-50%)}
.cw .chr{width:100%;height:auto}
.prp{position:absolute;z-index:1;line-height:1;animation:float 3s ease-in-out infinite;filter:drop-shadow(2px 3px 0 rgba(5,37,112,.25))}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(5deg)}}

/* ── portada de capítulo ── */
.chcover{background:linear-gradient(155deg,var(--g1),var(--g3));color:#fff;border-color:var(--navy)}
.chcover .pg{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:26px 30px 26px 46px;position:relative}
.chcover .num{font:400 clamp(90px,22vw,200px)/.8 var(--disp);color:transparent;-webkit-text-stroke:3px var(--yellow);letter-spacing:.04em;opacity:.95}
.chcover h2{font:400 clamp(40px,8vw,76px)/.95 var(--disp);letter-spacing:.04em;color:#fff;text-shadow:4px 4px 0 var(--navy)}
.chcover .yr{display:inline-block;background:var(--yellow);color:var(--navy);font:800 14px var(--head);padding:6px 16px;transform:skewX(-8deg);border-radius:4px;width:max-content}
.chcover .area{font:800 13px var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--yellow)}
.chcover .goal{max-width:52ch;font-size:16px;line-height:1.55;color:#E3EDFF;background:rgba(5,37,112,.45);border-left:5px solid var(--yellow);padding:10px 14px;border-radius:0 10px 10px 0}
.chcover .big{position:absolute;right:26px;top:22px;font-size:clamp(56px,12vw,110px);animation:float 3.2s ease-in-out infinite}

/* ── archivo / concepto ── */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-top:14px}
.fcard{perspective:900px;height:178px;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.2,.4,1);transform-style:preserve-3d}
.fcard.on .fi{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;border:3px solid var(--navy);border-radius:14px;backface-visibility:hidden;padding:14px;display:flex;flex-direction:column;box-shadow:4px 4px 0 var(--navy)}
.ff{background:#fff;align-items:center;justify-content:center;text-align:center;gap:6px}
.ff .ic{font-size:44px}
.ff b{font:800 15px var(--head);color:var(--navy)}
.ff small{font:700 10.5px var(--head);letter-spacing:.1em;text-transform:uppercase;color:#7A8BB8}
.fb{background:var(--navy);color:#fff;transform:rotateY(180deg);justify-content:center;font-size:13.5px;line-height:1.5}
.fb b{color:var(--yellow);font:800 13px var(--head);margin-bottom:6px;display:block}
.callout{display:flex;gap:12px;margin-top:14px;border:3px solid var(--navy);border-radius:12px;padding:12px 14px;background:#FFF3C4;box-shadow:4px 4px 0 var(--navy);font-size:14px;line-height:1.5}
.callout.w{background:#FFE3DD}
.callout b{display:block;font:800 12px var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--royal);margin-bottom:2px}
.callout.w b{color:#B8321F}
.quote{margin-top:16px;background:var(--navy);color:#fff;border-radius:14px;padding:16px 18px 16px 62px;position:relative;font:700 clamp(16px,2.4vw,20px)/1.35 var(--comic);box-shadow:5px 5px 0 var(--yellow)}
.quote::before{content:"“";position:absolute;left:14px;top:-6px;font:400 78px var(--disp);color:var(--yellow)}
.quote small{display:block;margin-top:6px;font:700 11px var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--yellow)}
.quote .owl{position:absolute;right:10px;bottom:-14px;width:54px}
.collect{animation:collect .8s cubic-bezier(.2,1.5,.4,1)}
@keyframes collect{0%{transform:scale(.6) rotate(-4deg);opacity:0}100%{transform:none;opacity:1}}

/* ── ejercicios ── */
.exq{font:800 clamp(18px,2.8vw,24px)/1.25 var(--head);color:var(--navy);margin:8px 0 14px}
.opts{display:grid;gap:10px}
.op{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:3px solid var(--navy);border-radius:12px;padding:12px 14px;font:600 15px/1.4 var(--body);box-shadow:3px 3px 0 var(--navy);transition:transform .12s,background .2s}
.op .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--yellow);border:2px solid var(--navy);display:grid;place-items:center;font:800 13px var(--head)}
.op:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--navy)}
.op.ok{background:#CFF5DB;border-color:#0E7A38}.op.no{background:#FFD9DA;border-color:#B91C1C;animation:shake .4s}.op.dim{opacity:.55}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col{display:grid;gap:9px;align-content:start}
.col h4{font:800 12px var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--royal)}
.it{background:#fff;border:3px solid var(--navy);border-radius:12px;padding:10px 12px;font:600 14px/1.38 var(--body);text-align:left;box-shadow:3px 3px 0 var(--navy);transition:transform .12s}
.it.sel{background:#FFF3C4;transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--yellow),5px 5px 0 2px var(--navy)}
.it.done{background:#CFF5DB;border-color:#0E7A38;pointer-events:none}
.it.err{animation:shake .4s;background:#FFD9DA}
.bk{margin-top:4px;display:grid;gap:12px}
.bk.c3{grid-template-columns:repeat(3,1fr)}.bk.c2{grid-template-columns:1fr 1fr}
.drop{min-height:92px;border:3px dashed var(--navy);border-radius:14px;padding:10px;display:grid;gap:8px;align-content:start;background:rgba(10,67,196,.06);cursor:pointer}
.drop:hover{background:rgba(255,194,14,.2)}
.drop h4{font:800 13px var(--head);color:var(--navy)}
.drop .it{font-size:13px;padding:8px 10px}
.pool{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px;margin-bottom:12px}
.seq{display:grid;gap:8px;margin-bottom:12px}
.seq .slot{border:3px dashed var(--navy);border-radius:10px;padding:8px 12px;font:700 14px var(--head);min-height:44px;background:rgba(10,67,196,.06);display:flex;align-items:center;gap:10px}
.seq .slot b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--yellow);border:2px solid var(--navy);display:grid;place-items:center;font-size:12px}
.seq .slot.f{background:#CFF5DB;border-style:solid;border-color:#0E7A38}
.fb2{margin-top:14px;border:3px solid var(--navy);border-radius:12px;padding:12px 14px;background:#fff;font-size:14px;line-height:1.5;display:none;box-shadow:4px 4px 0 var(--navy)}
.fb2.on{display:block;animation:collect .5s}
.fb2 h5{font:800 15px var(--head);margin-bottom:4px}
.fb2.good h5{color:#0E7A38}.fb2.mid h5{color:#B26A00}.fb2.bad h5{color:#B91C1C}
.stars{font-size:24px;letter-spacing:3px}

/* ── clínica / fin ── */
.sit{border:3px solid var(--navy);border-radius:14px;padding:12px;background:#fff;box-shadow:4px 4px 0 var(--navy);margin-top:12px}
.sit h4{font:800 13px var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--royal);margin-bottom:8px}
.sit .two .op{font-size:14px}
.certbox{border:3px solid var(--navy);border-radius:10px;padding:6px;background:#fff;box-shadow:5px 5px 0 var(--navy);margin-top:12px}
.certbox img{width:100%;height:auto;display:block;border-radius:4px;min-height:80px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{flex:1;min-width:110px;background:#fff;border:3px solid var(--navy);border-radius:12px;padding:10px;text-align:center;box-shadow:3px 3px 0 var(--navy)}
.stat b{display:block;font:800 26px var(--head);color:var(--royal)}.stat span{font:700 10.5px var(--head);letter-spacing:.1em;text-transform:uppercase;color:#6B7BA8}

/* ── índice (modal) ── */
.modal{position:fixed;inset:0;z-index:20;background:rgba(3,26,82,.72);display:none;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.mbox{background:var(--paper);border:3px solid var(--navy);border-radius:16px;width:min(640px,100%);max-height:88dvh;overflow:auto;padding:18px;box-shadow:8px 8px 0 var(--yellow)}
.mbox h3{font:800 22px var(--head);color:var(--navy);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.mrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:2.5px solid var(--navy);border-radius:12px;background:#fff;margin-top:8px;font:700 14px var(--head);color:var(--navy)}
.mrow:disabled{opacity:.4;cursor:not-allowed}
.mrow:hover:not(:disabled){background:#FFF3C4}
.mrow .e{font-size:26px}.mrow small{display:block;font:600 12px var(--body);color:#5B6C99}.mrow .s{margin-left:auto;font-size:14px;white-space:nowrap}

const BG=(function(){
  const cv=document.getElementById('bg'),cx=cv.getContext('2d');
  let W,H,D=Math.min(devicePixelRatio||1,2),mode='blocks',items=[],T=0,fade=1,pending=null;
  const slow=matchMedia('(prefers-reduced-motion: reduce)').matches?.3:1;
  const R=(a,b)=>a+Math.random()*(b-a);
  function size(){W=cv.width=innerWidth*D;H=cv.height=innerHeight*D;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';init();}
  function n(base){return Math.max(6,Math.round(base*Math.min(1,(innerWidth*innerHeight)/900000+.35)));}
  function init(){
    items=[];
    if(mode==='blocks'){const C=[[255,194,14,.8],[255,194,14,.5],[5,37,112,.5],[90,162,255,.4],[150,196,255,.3],[47,123,255,.45]];
      for(let i=0;i<n(16);i++){const s=R(70,200)*D;items.push({x:R(0,W),y:R(0,H+s),w:s*R(.5,1),h:s*R(1,1.8),sk:R(-.3,.3),vy:-R(.2,.55)*D,vx:R(-.15,.15)*D,r:R(-.4,.4),vr:R(-.0015,.0015),c:C[i%C.length],ph:R(0,6)});}}
    if(mode==='gears'){for(let i=0;i<n(11);i++){const r=R(40,130)*D;items.push({x:R(0,W),y:R(0,H),r,t:Math.round(r/(11*D))+5,a:R(0,6),va:R(.002,.007)*(i%2?1:-1),vx:R(-.12,.12)*D,vy:R(-.1,.1)*D,c:i%3===0?[255,194,14,.55]:[140,185,255,.28]});}}
    if(mode==='blueprint'){for(let i=0;i<n(14);i++)items.push({x:R(0,W),y:R(0,H),s:R(22,60)*D,vy:-R(.25,.7)*D,vx:R(-.1,.1)*D,a:R(.18,.5),k:i%3,ph:R(0,6)});}
    if(mode==='people'){for(let i=0;i<n(26);i++)items.push({x:R(0,W),y:R(0,H),vx:R(-.3,.3)*D,vy:R(-.3,.3)*D,r:R(10,22)*D,y2:i%4===0,ph:R(0,6)});
      for(let i=0;i<n(8);i++)items.push({b:1,x:R(0,W),y:H+R(0,H),vy:-R(.4,.9)*D,w:R(70,140)*D,ph:R(0,6)});}
    if(mode==='radar'){for(let i=0;i<n(16);i++)items.push({a:R(0,6.28),d:R(.12,1),life:R(0,1),warn:i%4===0,sp:R(.004,.01)});
      for(let i=0;i<n(7);i++)items.push({w:1,x:R(0,W),y:R(0,H),vy:-R(.2,.5)*D,s:R(26,50)*D,ph:R(0,6)});}
    if(mode==='network'){for(let i=0;i<n(36);i++)items.push({x:R(0,W),y:R(0,H),vx:R(-.3,.3)*D,vy:R(-.3,.3)*D,r:R(3,9)*D*(i%7===0?2.2:1),ph:R(0,6)});}
    if(mode==='loop'){for(let i=0;i<n(8);i++)items.push({x:R(0,W),y:R(0,H),r:R(70,170)*D,a:R(0,6),va:R(.003,.008)*(i%2?1:-1),vx:R(-.12,.12)*D,vy:R(-.1,.1)*D,w:R(.5,1)});}
    if(mode==='kanban'){const L=4;for(let i=0;i<n(24);i++){const lane=i%L;items.push({lane,x:R(0,W),w:R(90,170)*D,h:R(34,56)*D,v:R(.25,.7)*D*(lane%2?1:-1)*(1),c:[[255,194,14,.7],[255,255,255,.45],[125,180,255,.5],[255,140,100,.5]][i%4],ph:R(0,6)});}}
    if(mode==='sunrise'){for(let i=0;i<n(22);i++)items.push({x:R(0,W),y:H+R(0,H),vy:-R(.4,1.1)*D,s:R(10,26)*D,rot:R(0,6),vr:R(-.02,.02),c:i%3,ph:R(0,6)});}
  }
  function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();}
  function draw(){
    cx.clearRect(0,0,W,H);T++;
    const m=mode;
    if(m==='blocks'){items.forEach((b,i)=>{b.x+=b.vx*slow;b.y+=b.vy*slow;b.r+=b.vr*slow;if(b.y<-b.h*1.6){Object.assign(b,{y:H+b.h,x:R(0,W)});}
      const w=b.w/2,h=b.h/2,k=b.sk*b.h/2;cx.save();cx.translate(b.x,b.y);cx.rotate(b.r);cx.fillStyle=`rgba(${b.c[0]},${b.c[1]},${b.c[2]},${b.c[3]})`;
      cx.beginPath();cx.moveTo(-w+k,-h);cx.lineTo(w+k,-h);cx.lineTo(w-k,h);cx.lineTo(-w-k,h);cx.closePath();cx.fill();cx.restore();});}

      cx.save();cx.translate(g.x,g.y);cx.rotate(g.a);cx.fillStyle=`rgba(${g.c[0]},${g.c[1]},${g.c[2]},${g.c[3]})`;cx.beginPath();
      const N=g.t*2;for(let i=0;i<N;i++){const a0=i/N*6.2832,a1=(i+1)/N*6.2832,rr_=i%2?g.r*.82:g.r;cx.lineTo(Math.cos(a0)*rr_,Math.sin(a0)*rr_);cx.lineTo(Math.cos((a0+a1)/2)*rr_,Math.sin((a0+a1)/2)*rr_);}

/* ══════════ MOTOR DEL LIBRO ══════════ */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const KEY='sentinel_libro_v1';
let S={name:'',idx:0,max:0,ex:{},quotes:{}};
let PAGES=[],BUSY=false;

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.name)return d;}catch(e){}return null;}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600);}

/* ── estructura de páginas ── */
(function(){
  PAGES.push({k:'cover',label:'Portada'},{k:'chars',label:'El reparto'});
  CH.forEach((c,i)=>{
    PAGES.push({k:'chcover',i,theme:c.theme,label:`Capítulo ${c.n} · ${c.title}`});
    c.comic.forEach((_,j)=>PAGES.push({k:'comic',i,j,theme:c.theme,label:`Capítulo ${c.n} · ${c.title}`}));
    PAGES.push({k:'concept',i,theme:c.theme,label:`Capítulo ${c.n} · ${c.title}`});
    c.ex.forEach((_,j)=>PAGES.push({k:'ex',i,j,theme:c.theme,label:`Capítulo ${c.n} · ${c.title}`,gate:`${i}-${j}`}));
  });
  PAGES.push({k:'clinic',theme:'c8',label:'Epílogo · Clínica de decisiones',gate:'clinic'});
  PAGES.push({k:'end',theme:'c8',label:'Epílogo · Tu diploma'});
})();

/* ── estrellas ── */
function chStars(i){const vals=CH[i].ex.map((_,j)=>S.ex[`${i}-${j}`]);if(vals.some(v=>v===undefined))return 0;const a=vals.reduce((x,y)=>x+y,0)/vals.length;return a>=.85?3:a>=.6?2:1;}
function totalStars(){return CH.reduce((a,_,i)=>a+chStars(i),0);}
function avgPct(){const keys=Object.keys(S.ex);if(!keys.length)return 0;return Math.round(100*keys.reduce((a,k)=>a+S.ex[k],0)/keys.length);}
function firstName(){return (S.name||'').split(' ')[0];}

/* ── piezas de dibujo ── */
function panelHTML(pn,idx){
  const rot=((idx*37)%5-2)*.35;
  const sx={};(pn.chars||[]).forEach(c=>sx[c[0]]=c[1]);
  const says=(pn.says||[]).map((s,k)=>{const x=sx[s[0]]!==undefined?sx[s[0]]:50;const left=x<50;
    return `<div class="bub ${left?'l':'r'}" style="--d:${k*.7}s;--tl:${left?Math.max(8,Math.min(60,x-4)):Math.min(84,Math.max(40,x-18))}%"><b style="display:none">${esc(s[0])}</b>${esc(s[1])}</div>`;}).join('');
  const chars=(pn.chars||[]).map(c=>`<div class="cw" style="left:${c[1]}%">${charSVG(c[0],c[2],c[3])}</div>`).join('');
  const props=(pn.props||[]).map(p=>`<span class="prp" style="left:${p[1]}%;bottom:${p[2]}px;font-size:${p[3]}px;transform:translateX(-50%)">${p[0]}</span>`).join('');
  return `<div class="panel" style="--rot:${rot}deg">${pn.cap?`<div class="cap">${esc(pn.cap)}</div>`:''}
    <div class="scene bg-${pn.bg||'office'}"><div>${pn.sfx?`<div class="sfx">${esc(pn.sfx)}</div>`:''}${says}</div><div class="chrow">${props}${chars}</div></div></div>`;
}
function foot(p,n){return `<div class="pgfoot"><span>${esc(p.label)}</span><span>Pág. ${n+1} / ${PAGES.length}</span></div>`;}

function makeLeaf(p,n){
  const h=p.k==='cover'?pageCover():p.k==='chars'?pageChars(n):p.k==='chcover'?pageChCover(p,n):p.k==='comic'?pageComic(p,n):p.k==='concept'?pageConcept(p,n):p.k==='ex'?pageEx(p,n):p.k==='clinic'?pageClinic(p,n):pageEnd(p,n);
  const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;
}

/* ── navegación ── */
function gateOK(p){return !p.gate||S.ex[p.gate]!==undefined;}
function updateNav(){
  const p=PAGES[S.idx];
  $('prev').disabled=S.idx===0||BUSY;
  const last=S.idx===PAGES.length-1;
  $('next').disabled=last||BUSY||p.k==='cover'||!gateOK(p);
  $('next').textContent=p.k==='chars'?'Comenzar la historia ▶':last?'Fin':'Siguiente ▶';
  $('gate').textContent=(!gateOK(p)&&p.k!=='cover')?'✏️ Resuelve el ejercicio para pasar la página':'';
  $('stars').textContent=totalStars();
  $('who').textContent=S.name?firstName():'Lector/a';
  const cur=p.i!==undefined?p.i:(S.idx>=PAGES.length-2?CH.length:-1);
  document.querySelectorAll('.prog i b').forEach((b,i)=>{b.style.width=i<cur?'100%':i===cur?Math.max(10,Math.round(100*chProgress(i))) +'%':'0%';});
  $('hdr').style.display=p.k==='cover'?'none':'flex';
}
function chProgress(i){const idxs=PAGES.map((p,k)=>p.i===i?k:-1).filter(k=>k>=0);const a=idxs[0],b=idxs[idxs.length-1];return Math.min(1,Math.max(0,(S.idx-a+1)/(b-a+1)));}
function go(idx,dir){
  if(BUSY||idx<0||idx>=PAGES.length)return;
  const first=!$('book').querySelector('.leaf');
  const p=PAGES[idx],el=makeLeaf(p,idx);
  const book=$('book'),old=book.querySelector('.leaf.top');
  S.idx=idx;S.max=Math.max(S.max,idx);save();
  BG.set(p.theme||'cover');
  if(!old){el.classList.add('top');book.appendChild(el);afterShow(el,p,0);}
  else{
    BUSY=true;updateNav();
    if(dir>=0){el.classList.add('under');book.appendChild(el);old.classList.remove('top');old.classList.add('turn-out');
      setTimeout(()=>{old.remove();el.classList.remove('under');el.classList.add('top');BUSY=false;updateNav();},880);}
    else{el.classList.add('turn-in');book.appendChild(el);
      setTimeout(()=>{old.remove();el.classList.remove('turn-in');el.classList.add('top');BUSY=false;updateNav();},880);}
    afterShow(el,p,650);
  }
  updateNav();
}
function next(){go(S.idx+1,1);}
function prev(){go(S.idx-1,-1);}

/* ── activación por página ── */
function afterShow(el,p,delay){
  const pg=el.querySelector('.pg');if(pg)pg.scrollTop=0;
  if(p.k==='cover')initCover(el);
  if(p.k==='chars'||p.k==='chcover'||p.k==='comic'){
    const items=[...el.querySelectorAll('.panel')];
    items.forEach((pn,k)=>setTimeout(()=>pn.classList.add('in'),delay+150+k*650));
    if(p.k==='chars')setTimeout(()=>el.classList.add('in'),delay+100);
    el.querySelectorAll('.panel').forEach(pn=>pn.addEventListener('click',()=>{pn.classList.remove('in');void pn.offsetWidth;pn.classList.add('in');}));
  }
  if(p.k==='concept'){
    el.querySelectorAll('.fcard').forEach(f=>{f.onclick=()=>f.classList.toggle('on');f.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f.classList.toggle('on');}};});
    setTimeout(()=>{const q=el.querySelector('.quote');if(q){q.classList.add('collect');}if(!S.quotes[p.i]){S.quotes[p.i]=1;save();toast('🦉 Frase coleccionada · '+Object.keys(S.quotes).length+' de '+CH.length);}},delay+500);
  }
  if(p.k==='ex')initEx(el,p);
  if(p.k==='clinic')initClinic(el,p);
  if(p.k==='end')initEnd(el);
}

function initCover(el){
  const inp=el.querySelector('#nm'),btn=el.querySelector('#openBtn'),saved=load();
  const ok=()=>inp.value.trim().length>=3;
  inp.oninput=()=>{btn.disabled=!ok();};
  const open=()=>{if(!ok())return;S.name=inp.value.trim().replace(/\s+/g,' ');save();go(1,1);};
  btn.onclick=open;inp.onkeydown=e=>{if(e.key==='Enter')open();};
  if(saved){const r=el.querySelector('#resume');r.style.display='flex';const rb=el.querySelector('#resBtn');rb.textContent=`Continuar como ${saved.name.split(' ')[0]} (pág. ${saved.idx+1})`;
    rb.onclick=()=>{S=Object.assign({name:'',idx:0,max:0,ex:{},quotes:{}},saved);go(Math.max(1,S.idx),1);};
    el.querySelector('#newBtn').onclick=()=>{try{localStorage.removeItem(KEY);}catch(e){}S={name:'',idx:0,max:0,ex:{},quotes:{}};r.style.display='none';};}
}

/* ── ejercicios ── */
function fbShow(frac,why){
  const f=$('fb');const cls=frac>=.99?'good':frac>=.6?'mid':'bad';
  const t=frac>=.99?'¡Decisión acertada!':frac>=.6?'Bien, con algunos tropiezos':'Revisemos esto';
  f.className='fb2 on '+cls;f.innerHTML=`<h5>${t}</h5>${esc(why)}`;
  setTimeout(()=>{const pg=document.querySelector('.leaf.top .pg');if(pg)pg.scrollTo({top:pg.scrollHeight,behavior:'smooth'});},120);
}
function exDone(key,frac,why,p){
  S.ex[key]=frac;save();fbShow(frac,why);updateNav();
  if(p&&p.i!==undefined&&p.j===CH[p.i].ex.length-1){const s=chStars(p.i);setTimeout(()=>toast('Capítulo '+CH[p.i].n+' completado · '+'⭐'.repeat(s)),700);}
}
function initEx(el,p){
  const ex=CH[p.i].ex[p.j],body=el.querySelector('#exbody'),key=p.gate;let errors=0;
  const fin=n=>exDone(key,n/(n+errors),ex.why,p);
  if(S.ex[key]!==undefined&&ex.t!=='x'){/* ya resuelto: permite repasar */}
  if(ex.t==='mcq'){
    const opts=shuffle(ex.opts);body.innerHTML=`<div class="opts">${opts.map((o,k)=>`<button class="op" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(o[0])}</span></button>`).join('')}</div>`;
    body.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;body.querySelectorAll('.op').forEach((x,i)=>{x.disabled=true;if(opts[i][1])x.classList.add('ok');else if(i===k)x.classList.add('no');else x.classList.add('dim');});exDone(key,opts[k][1]?1:0,ex.why,p);});
  }
  if(ex.t==='match'){
    const L=ex.pairs.map((p2,i)=>({t:p2[0],i})),R=shuffle(ex.pairs.map((p2,i)=>({t:p2[1],i})));let sel=null,m=0;
    body.innerHTML=`<p class="lede" style="margin:-6px 0 10px">Toca un elemento de la izquierda y luego su pareja.</p><div class="two"><div class="col" id="cl">${L.map(x=>`<button class="it" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div><div class="col" id="cr">${R.map(x=>`<button class="it" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div></div>`;
    body.querySelectorAll('#cl .it').forEach(b=>b.onclick=()=>{body.querySelectorAll('#cl .it').forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel');});
    body.querySelectorAll('#cr .it').forEach(b=>b.onclick=()=>{if(!sel)return toast('Primero toca un elemento de la izquierda');
      if(sel.dataset.i===b.dataset.i){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel=null;m++;if(m===L.length)fin(m);}
      else{errors++;b.classList.add('err');setTimeout(()=>b.classList.remove('err'),420);}});
  }
  if(ex.t==='buckets'){
    const cards=shuffle(ex.cards.map((c,i)=>({t:c[0],c:c[1],i})));let sel=null,left=cards.length;const nc=ex.cols.length;
    body.innerHTML=`<p class="lede" style="margin:-6px 0 10px">Toca una tarjeta y luego la columna donde va.</p><div class="pool" id="pool">${cards.map(c=>`<button class="it" data-i="${c.i}" data-c="${c.c}">${esc(c.t)}</button>`).join('')}</div><div class="bk c${nc}">${ex.cols.map((t,k)=>`<div class="drop" data-c="${k}" tabindex="0"><h4>${esc(t)}</h4></div>`).join('')}</div>`;
    const pick=b=>{body.querySelectorAll('#pool .it').forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel');};
    body.querySelectorAll('#pool .it').forEach(b=>b.onclick=()=>pick(b));
    body.querySelectorAll('.drop').forEach(d=>d.onclick=()=>{if(!sel)return toast('Primero toca una tarjeta');
      if(sel.dataset.c===d.dataset.c){sel.classList.remove('sel');sel.classList.add('done');sel.onclick=null;d.appendChild(sel);sel=null;left--;if(!left)fin(cards.length);}
      else{errors++;const s=sel;s.classList.add('err');setTimeout(()=>s.classList.remove('err'),420);}});
  }
  if(ex.t==='order'){
    const chips=shuffle(ex.items.map((t,i)=>({t,i})));let nx=0;
    body.innerHTML=`<p class="lede" style="margin:-6px 0 10px">Toca los pasos en el orden correcto.</p><div class="seq" id="seq">${ex.items.map((_,i)=>`<div class="slot"><b>${i+1}</b><span></span></div>`).join('')}</div><div class="pool" id="pool">${chips.map(c=>`<button class="it" data-i="${c.i}">${esc(c.t)}</button>`).join('')}</div>`;
    body.querySelectorAll('#pool .it').forEach(b=>b.onclick=()=>{if(+b.dataset.i===nx){const s=body.querySelectorAll('.slot')[nx];s.classList.add('f');s.querySelector('span').textContent=ex.items[nx];b.classList.add('done');b.style.visibility='hidden';nx++;if(nx===ex.items.length)fin(nx);}
      else{errors++;b.classList.add('err');setTimeout(()=>b.classList.remove('err'),420);}});
  }
}

/* ── clínica final ── */
function initClinic(el,p){
  const box=el.querySelector('#clinic');let good=0,answered=0;
  box.innerHTML=FINAL.map((s,i)=>{const o=shuffle([[s.bad,0],[s.good,1]]);return `<div class="sit" data-i="${i}"><h4>Situación ${i+1} · ${esc(s.s)}</h4><div class="two">${o.map(x=>`<button class="op" data-g="${x[1]}"><span class="k">${x[1]?'✓':'?'}</span><span>${esc(x[0])}</span></button>`).join('')}</div></div>`;}).join('');
  box.querySelectorAll('.sit').forEach(sit=>sit.querySelectorAll('.op').forEach(b=>b.onclick=()=>{
    sit.querySelectorAll('.op').forEach(x=>{x.disabled=true;x.querySelector('.k').textContent=x.dataset.g==='1'?'✓':'✗';if(x.dataset.g==='1')x.classList.add('ok');else if(x===b)x.classList.add('no');else x.classList.add('dim');});
    if(b.dataset.g==='1')good++;answered++;
    if(answered===FINAL.length){const frac=good/FINAL.length;S.ex.clinic=frac;save();updateNav();fbShow(frac,'Las decisiones positivas aparecen en tu pantalla marcadas con ✓: priorizar por valor, estimar con el equipo, probar desde el inicio y cerrar con aceptación, transferencia y medición de beneficios.');}
  }));
}

/* ── diploma ── */
let CERT={canvas:null};
function summary(){const avg=avgPct();return {avg,cat:avg>=90?{n:'Oro',e:'🥇'}:avg>=75?{n:'Plata',e:'🥈'}:{n:'Bronce',e:'🥉'}};}
function certCode(sm,d){let h=5381;const s=`${S.name}|${sm.avg}|${totalStars()}|${d}`;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;const t=h.toString(36).toUpperCase().padStart(8,'0').slice(-8);return `SN-${t.slice(0,4)}-${t.slice(4)}`;}
function wrapLines(c,t,w){const ws=t.split(' '),ls=[];let cur='';ws.forEach(x=>{const u=cur?cur+' '+x:x;if(c.measureText(u).width>w&&cur){ls.push(cur);cur=x;}else cur=u;});if(cur)ls.push(cur);return ls;}
function initEnd(el){
  const sm=summary();el.querySelector('#endname').textContent=firstName();
  el.querySelector('#endstats').innerHTML=`<div class="stat"><b>${sm.avg}%</b><span>Precisión</span></div><div class="stat"><b>${totalStars()}/${CH.length*3}</b><span>Estrellas</span></div><div class="stat"><b>${Object.keys(S.quotes).length}/${CH.length}</b><span>Frases</span></div><div class="stat"><b>${sm.cat.e}</b><span>Categoría ${sm.cat.n}</span></div>`;
  drawCert();
}
async function drawCert(){
  try{await Promise.all([document.fonts.load('800 80px Montserrat'),document.fonts.load('500 30px Inter'),document.fonts.load('400 60px Bangers')]);}catch(e){}
  const W=1754,H=1240,cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');

function fileBase(){return 'Certificado_Sentinel_'+S.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');}
function saveBlob(b,n){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u);},2000);}
function dlPNG(){if(!CERT.canvas)return toast('El diploma se está preparando…');CERT.canvas.toBlob(b=>{if(!b)return toast('No se pudo generar la imagen');saveBlob(b,fileBase()+'.png');toast('📥 Diploma PNG descargado');},'image/png');}
function makePDF(u,w,h){const bin=atob(u.split(',')[1]),jpg=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)jpg[i]=bin.charCodeAt(i);
  const pw=842,ph=Math.round(842*h/w),enc=new TextEncoder(),parts=[],off=[];let pos=0;const push=x=>{const v=typeof x==='string'?enc.encode(x):x;parts.push(v);pos+=v.length;};
  push('%PDF-1.4\n');off[1]=pos;push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');off[2]=pos;push('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  off[3]=pos;push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
  off[4]=pos;push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);push(jpg);push('\nendstream\nendobj\n');
  const ct=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;off[5]=pos;push(`5 0 obj\n<< /Length ${ct.length} >>\nstream\n${ct}\nendstream\nendobj\n`);
  const xr=pos;let x='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<=5;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';push(x+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);return new Blob(parts,{type:'application/pdf'});}
function dlPDF(){if(!CERT.canvas)return toast('El diploma se está preparando…');try{saveBlob(makePDF(CERT.canvas.toDataURL('image/jpeg',.95),CERT.canvas.width,CERT.canvas.height),fileBase()+'.pdf');toast('📥 Diploma PDF descargado');}catch(e){toast('No se pudo generar el PDF. Descarga el PNG.');}}

/* ── índice ── */
function openIndex(){
  const rows=[{e:'📖',t:'Portada',s:'',i:0},{e:'🎭',t:'El reparto',s:'Personajes y funciones',i:1}];
  CH.forEach((c,i)=>{const k=PAGES.findIndex(p=>p.k==='chcover'&&p.i===i);rows.push({e:c.ic,t:`Capítulo ${c.n} · ${c.title}`,s:`${c.year} · ${c.area}`,i:k,st:chStars(i),q:S.quotes[i]});});
  rows.push({e:'🏆',t:'Epílogo · Clínica y diploma',s:'',i:PAGES.findIndex(p=>p.k==='clinic')});
  $('mlist').innerHTML=rows.map(r=>`<button class="mrow" data-i="${r.i}" ${r.i>S.max?'disabled':''}><span class="e">${r.e}</span><span>${esc(r.t)}<small>${esc(r.s)}</small></span><span class="s">${r.st!==undefined?(r.st?'⭐'.repeat(r.st):'—'):''}${r.q?' 🦉':''}</span></button>`).join('');
  $('mlist').querySelectorAll('.mrow').forEach(b=>b.onclick=()=>{$('modal').classList.remove('on');const t=+b.dataset.i;go(t,t>=S.idx?1:-1);});
