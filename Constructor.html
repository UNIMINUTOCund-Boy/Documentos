<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}</style></head><body><title>Constructor de Riesgos UNIMINUTO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: mesa de trabajo sobre papel cuadriculado. Izquierda: la fase activa. Derecha (escritorio): la ficha del taller que se llena en vivo. */
:root{
  --paper:#eef2f9; --grid:rgba(27,70,145,.07); --surface:#ffffff; --sunk:#f4f6fb; --ink:#101b33; --muted:#56627d; --line:#d3dbea;
  --navy:#0f2a5c; --blue:#1b4691; --blue-soft:#e3eafb; --sun:#ffcc00; --sun-ink:#4d3d00; --on-blue:#ffffff;
  --ok:#17784a; --ok-bg:#ddf3e7; --mid:#985a00; --mid-bg:#fdefd6; --bad:#b42318; --bad-bg:#fde4e1;
  --l1:#bfe6cf; --l2:#ffe58a; --l3:#ffb870; --l4:#f27b70;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"Figtree","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0a1326; --grid:rgba(126,166,255,.06); --surface:#111d38; --sunk:#0d1730; --ink:#e8eefb; --muted:#9aa9c7; --line:#24365e;
  --navy:#0b1a3a; --blue:#86abff; --blue-soft:#1a2b52; --sun:#ffcc00; --sun-ink:#ffdd55; --on-blue:#0a1326;
  --ok:#6fd8a2; --ok-bg:#12321f; --mid:#f3b862; --mid-bg:#362710; --bad:#ff9a8f; --bad-bg:#3c1714;
  --l1:#1f5a3c; --l2:#6b5a10; --l3:#7a4214; --l4:#7d2721; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0a1326; --grid:rgba(126,166,255,.06); --surface:#111d38; --sunk:#0d1730; --ink:#e8eefb; --muted:#9aa9c7; --line:#24365e;
  --navy:#0b1a3a; --blue:#86abff; --blue-soft:#1a2b52; --sun:#ffcc00; --sun-ink:#ffdd55; --on-blue:#0a1326;
  --ok:#6fd8a2; --ok-bg:#12321f; --mid:#f3b862; --mid-bg:#362710; --bad:#ff9a8f; --bad-bg:#3c1714;
  --l1:#1f5a3c; --l2:#6b5a10; --l3:#7a4214; --l4:#7d2721; color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
/* encabezado */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);box-shadow:0 1px 0 var(--line)}
header.top::after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--navy) 0 62%,var(--sun) 62% 78%,var(--blue) 78%)}
.toprow{display:flex;align-items:center;gap:16px;padding-block:10px}
.logo{background:#fff;border-radius:10px;padding:5px 9px;display:flex;flex-shrink:0;box-shadow:0 0 0 1px var(--line)}
.logo img{height:42px;width:auto;display:block}
.ttl{flex:1;min-width:0}
.ttl b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;display:block;line-height:1.1}
.ttl span{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{display:flex;align-items:center;gap:8px;flex-shrink:0}
.clock svg{width:44px;height:44px;transform:rotate(-90deg)}
.clock circle{fill:none;stroke-width:5}
.clock .bg{stroke:var(--line)} .clock .fg{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.clock.low .fg{stroke:var(--sun)} .clock.out .fg{stroke:var(--bad)}
.clock b{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums}
.clock small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.route{display:flex;align-items:flex-start;padding-block:2px 10px;overflow-x:auto;scrollbar-width:none}
.route div{flex:1;min-width:54px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;font-size:11px;color:var(--muted)}
.route div::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.route div:first-child::before{display:none}
.route div.done::before,.route div.cur::before{background:var(--blue)}
.route i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:11px;font-weight:700;background:var(--surface);border:2px solid var(--line);position:relative;z-index:1}
.route div.done i{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.route div.cur i{background:var(--sun);border-color:var(--sun);color:#2b2200;box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 30%,transparent)}
.route div.cur{color:var(--ink);font-weight:700}
@media (max-width:720px){.route span{display:none}.logo img{height:32px}.ttl span{display:none}.clock small{display:none}}
/* zona de trabajo */
.desk{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start;padding-block:24px 56px}
.desk.solo{grid-template-columns:minmax(0,1fr)}
@media (max-width:1000px){.desk{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:18px;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
[hidden]{display:none!important}
@media (max-width:600px){.card{padding:16px;border-radius:14px}.ttl b{font-size:16px}.hero{padding:18px;border-radius:16px}.dossier{padding:16px}.clock svg{width:36px;height:36px}}
@keyframes rise{from{transform:translateY(10px);opacity:.9}to{transform:none;opacity:1}}
.eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--blue);font-weight:700}
.eyebrow .tm{background:var(--blue-soft);border-radius:999px;padding:2px 9px;letter-spacing:.04em}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(30px,4.6vw,48px);font-weight:800;line-height:1.02}
h2{font-size:clamp(23px,2.8vw,30px);font-weight:800;line-height:1.1}
h3{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
p{margin:0;max-width:68ch}
.lead{font-size:16.5px;color:var(--muted)}
.muted{color:var(--muted)} .note{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid2>*{min-width:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
input[type=text],textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--sunk);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button{font:inherit;cursor:pointer;color:inherit}
.btn{background:var(--blue);color:var(--on-blue);border:0;border-radius:12px;padding:12px 20px;font-weight:700;display:inline-flex;gap:8px;align-items:center;transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sun{background:var(--sun);color:#2b2200}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--line)}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
/* portada del caso */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:12px;align-items:center;background:var(--navy);color:#fff;border-radius:22px;padding:30px;overflow:hidden;position:relative}
.hero h1{color:#fff} .hero h1 em{font-style:normal;color:var(--sun)}
.hero p{color:#c8d4f0}
.hero .eyebrow{color:var(--sun)}
.hero .eyebrow .tm{background:rgba(255,255,255,.12);color:#fff}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:22px}.iso{height:190px}}
.iso{height:260px;display:grid;place-items:center;perspective:900px}
.iso-grid{display:grid;grid-template-columns:repeat(5,34px);gap:6px;transform:rotateX(58deg) rotateZ(-42deg);transform-style:preserve-3d}
.iso-grid span{width:34px;height:34px;border-radius:5px;transform-style:preserve-3d;box-shadow:0 0 0 1px rgba(255,255,255,.15) inset}
.iso-grid span.h{animation:lift 3.6s ease-in-out infinite}
@keyframes lift{0%,100%{transform:translateZ(var(--z))}50%{transform:translateZ(calc(var(--z) + 6px))}}
.pin{position:absolute;width:20px;height:20px;border-radius:50% 50% 50% 0;background:var(--sun);transform:rotate(-45deg);box-shadow:0 0 0 6px rgba(255,204,0,.25)}
.dossier{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:24px;display:flex;flex-direction:column;gap:16px;margin-top:22px}
.dossier::before{content:"EXPEDIENTE DEL CASO";position:absolute;top:-24px;left:-1px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:4px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--blue)}
.objs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.obj{display:flex;gap:10px;background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:14px}
.obj b{font-family:var(--mono);background:var(--blue);color:var(--on-blue);border-radius:7px;padding:1px 7px;height:fit-content;font-size:12px}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who span{font-size:13px;border:1px dashed var(--line);border-radius:999px;padding:4px 11px}
.finds{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.find{border-left:4px solid var(--blue);background:var(--sunk);border-radius:0 12px 12px 0;padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.find b{font-family:var(--display)}
.find ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:3px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;font-size:14px}
.rules div{display:flex;gap:8px;align-items:flex-start}
.rules div::before{content:"";flex:0 0 8px;height:8px;margin-top:7px;border-radius:2px;background:var(--sun);transform:rotate(45deg)}
.taskbox{background:var(--blue-soft);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fields{display:flex;flex-wrap:wrap;gap:6px}
.fields span{font-family:var(--mono);font-size:12px;background:var(--surface);border-radius:6px;padding:3px 8px}
.risks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.rk{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s}
.rk:hover{transform:translateY(-2px);border-color:var(--blue)}
.rk.sel{border-color:var(--blue);background:var(--blue-soft)}
.rk svg{width:46px;height:46px}
.rk code{font-family:var(--mono);font-size:12px;color:var(--blue)}
.rk b{font-family:var(--display);font-size:17px;line-height:1.2}
/* opciones */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;background:var(--sunk);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt .k{flex:0 0 22px;height:22px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-size:11.5px;font-weight:700;background:var(--surface);border:1px solid var(--line)}
.opt.sel .k{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.opt:disabled{cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--sunk);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600}
.chip.sel{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.chip.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)} .chip.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.chip:disabled{cursor:default}
.q{background:var(--sunk);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.q .say{font-family:var(--display);font-size:17px;font-weight:500;line-height:1.35}
/* frase */
.sentence{position:relative;background:var(--navy);color:#e9efff;border-radius:16px;padding:20px 22px 20px 58px;font-size:17px;line-height:1.65}
.sentence::before{content:"“";position:absolute;left:16px;top:-6px;font-family:var(--display);font-size:78px;color:var(--sun);line-height:1}
.sentence em{font-style:normal;font-weight:700;color:#fff;background:linear-gradient(transparent 62%,rgba(255,204,0,.45) 0)}
.sentence .gap{color:#93a5d1;border-bottom:2px dashed #5d73ab}
/* retroalimentación */
.fb{border-radius:14px;padding:14px 16px;font-size:14.5px;display:flex;flex-direction:column;gap:7px;position:relative}
.fb.ok{background:var(--ok-bg)} .fb.mid{background:var(--mid-bg)} .fb.bad{background:var(--bad-bg)}
.fb .t{font-family:var(--display);font-weight:700;font-size:16px;padding-right:90px}
.fb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.stamp{position:absolute;top:12px;right:14px;font-family:var(--mono);font-weight:700;font-size:13px;border:2px solid currentColor;border-radius:8px;padding:3px 8px;transform:rotate(-6deg);animation:stamp .4s cubic-bezier(.3,1.6,.5,1)}
.fb.ok .stamp{color:var(--ok)} .fb.mid .stamp{color:var(--mid)} .fb.bad .stamp{color:var(--bad)}
@keyframes stamp{from{transform:scale(2.2) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
/* matriz */
.mxbox{display:grid;grid-template-columns:22px minmax(0,1fr);grid-template-rows:auto 20px;gap:6px;max-width:400px;width:100%}
.mx{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.mx button{aspect-ratio:1;border:2.5px solid transparent;border-radius:9px;font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink);transition:transform .12s}
.mx button:hover:not(:disabled){transform:scale(1.07)}
.mx .l1{background:var(--l1)} .mx .l2{background:var(--l2)} .mx .l3{background:var(--l3)} .mx .l4{background:var(--l4)}
.mx button.sel{border-color:var(--ink);transform:scale(1.1);box-shadow:0 6px 14px rgba(0,0,0,.25)}
.mx button.exp{outline:3px dashed var(--blue);outline-offset:-6px}
.mx button:disabled{cursor:default}
.ax{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center}
.ax.y{writing-mode:vertical-rl;transform:rotate(180deg)}
.lvl{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;color:var(--ink)}
.lvl.l1{background:var(--l1)} .lvl.l2{background:var(--l2)} .lvl.l3{background:var(--l3)} .lvl.l4{background:var(--l4)}
.readout{background:var(--sunk);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.readout .v{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.ev{display:flex;flex-direction:column;gap:8px}
.ev div{background:var(--sunk);border-radius:10px;padding:10px 12px 10px 38px;font-size:14px;position:relative}
.ev div::before{content:"i";position:absolute;left:11px;top:10px;width:18px;height:18px;border-radius:50%;background:var(--blue);color:var(--on-blue);font-family:var(--mono);font-size:11px;font-weight:700;display:grid;place-items:center}
/* controles */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.slot{border:2px dashed var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;background:transparent;min-width:0}
.slot.act{border-style:solid;border-color:var(--sun);background:color-mix(in srgb,var(--sun) 10%,var(--surface))}
.slot .ph{color:var(--muted);font-size:13.5px}
.slot h3{display:flex;gap:8px;align-items:center}
.slot h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.attrs{display:flex;flex-wrap:wrap;gap:4px;font-size:11.5px;font-weight:600}
.attrs span{border-radius:6px;padding:2px 7px;background:var(--bad-bg);color:var(--bad)}
.attrs span.y{background:var(--ok-bg);color:var(--ok)}
.opt.used{opacity:.5}
.report{background:var(--sunk);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--blue);font-weight:700}
/* consola de señales */
.console{background:var(--navy);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;color:#e9efff}
.console .mine{font-size:13.5px;color:#c8d4f0;border-left:3px solid var(--sun);padding-left:10px}
.signal{background:#16336f;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;animation:ping .5s cubic-bezier(.2,.8,.2,1)}
@keyframes ping{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.signal .dot{flex:0 0 12px;height:12px;border-radius:50%;background:var(--sun);margin-top:6px;box-shadow:0 0 0 0 rgba(255,204,0,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(255,204,0,0)}100%{box-shadow:0 0 0 0 rgba(255,204,0,0)}}
.signal .tag{color:var(--sun)}
.signal p{color:#fff;font-size:15.5px}
.decide{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.decide button{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:12px;text-align:left;font-weight:600;display:flex;flex-direction:column;gap:2px}
.decide button small{font-weight:400;color:#b9c7ea;font-size:12.5px}
.decide button:hover{border-color:var(--sun)}
.log{display:flex;flex-direction:column;gap:8px}
.log div{border-radius:12px;padding:10px 12px;font-size:13.5px;background:rgba(255,255,255,.06);border-left:4px solid}
.log .g{border-color:#6fd8a2} .log .m{border-color:#f3b862} .log .b{border-color:#ff9a8f}
.log b{color:#fff}
.log span{color:#c8d4f0}
/* ficha del taller */
aside.ficha{position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px);background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;max-height:calc(100vh - 150px);display:flex;flex-direction:column}
@media (max-width:1000px){aside.ficha{position:static;max-height:none}}
.fhead{background:var(--blue);color:var(--on-blue);padding:14px 16px;display:flex;flex-direction:column;gap:2px;position:relative}
.fhead::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:12px;background:radial-gradient(circle at 6px 0,transparent 5px,var(--surface) 5.5px) 0 0/12px 12px repeat-x}
.fhead small{font-family:var(--mono);font-size:11px;letter-spacing:.08em;opacity:.85}
.fhead b{font-family:var(--display);font-size:17px;line-height:1.2}
.fprog{height:5px;background:rgba(255,255,255,.25);border-radius:3px;margin-top:8px;overflow:hidden}
.fprog i{display:block;height:100%;background:var(--sun);transition:width .5s}
.fbody{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.fr{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.fr:last-child{border-bottom:0}
.fr i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-top:3px}
.fr.on i{background:var(--blue);border-color:var(--blue)}
.fr.ok i{background:var(--ok);border-color:var(--ok)}
.fr small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.fr span{display:block;overflow-wrap:anywhere}
.fr.off span{color:var(--muted);font-style:italic}
/* resultado */
.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:600px){.result{grid-template-columns:1fr;justify-items:start}}
.seal{width:170px;height:170px;position:relative;display:grid;place-items:center}
.seal svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seal .core{width:118px;height:118px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;text-align:center;box-shadow:0 0 0 6px var(--sun)}
.seal .core b{font-family:var(--display);font-size:42px;font-weight:800;line-height:1;display:block}
.seal .core small{font-size:12px;opacity:.85}
.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:4px 10px;font-size:13.5px;align-items:center}
.barrow .tr{grid-column:1/-1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.barrow .tr i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.barrow .n{text-align:right;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.toast{border-radius:12px;padding:11px 14px;font-size:14px}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>

/* ===== Temporizador ===== */
function tick(){const el=$("#timer"),ring=$("#ring"),box=$("#clock");if(!S.t0){el.textContent="30:00";ring.style.strokeDashoffset=0;box.className="clock";return}
 const left=30*60-Math.floor(((S.tEnd||Date.now())-S.t0)/1000),a=Math.abs(left);
 el.textContent=(left<0?"+":"")+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0");
 ring.style.strokeDashoffset=113.1*(1-Math.max(0,left)/1800);box.className="clock"+(left<0?" out":left<300?" low":"")}
setInterval(tick,1000);
function used(){if(!S.t0)return"—";const s=Math.floor(((S.tEnd||Date.now())-S.t0)/1000);return Math.floor(s/60)+" min "+(s%60)+" s"}
const over=()=>S.t0&&((S.tEnd||Date.now())-S.t0)>1800000;

/* ===== Navegación ===== */
function route(){$("#route").innerHTML=STEPS.map((n,i)=>`<div class="${i<S.step?"done":i===S.step?"cur":""}"><i>${i<S.step?"✓":i}</i><span>${n}</span></div>`).join("")}
function go(n){S.step=n;save();render();window.scrollTo({top:0,behavior:"smooth"})}
function fbBox(st){const f=S.fb[st];if(!f)return"";return`<div class="fb ${f.c}"><span class="stamp">${stampTxt(f.c)} · ${r1(S.sc[st])}/${MAXP[st]}</span><div class="t">${f.h}</div>${f.b}</div>`}
function nav(st,can){return`<div class="actions">${S.fb[st]?`<button class="btn" id="next">Continuar →</button>`:`<button class="btn" id="val" ${can?"":"disabled"}>Validar mis respuestas</button>`}</div>`}
function bindNav(st,validate){const v=$("#val");if(v)v.onclick=()=>{validate();save();render()};const n=$("#next");if(n)n.onclick=()=>go(st+1)}
function head(n,time,title,lead){return`<div class="eyebrow">Fase ${n} de 7 <span class="tm">≈ ${time} min</span> ${S.rk?`<span class="tm">${RK().id}</span>`:""}</div><h2>${title}</h2>${lead?`<p class="lead">${lead}</p>`:""}`}

/* ===== Ficha viva del taller ===== */
function fichaRows(){const r=RK();if(!r)return[];const d=S.red,c=S.ctrl,x=S.resp,rp=r.resp;
 return[["Causa",d.causa!=null?r.causa[d.causa].t:null,2],["Evento",d.evento!=null?r.evento[d.evento].t:null,2],["Consecuencia",d.cons!=null?r.cons[d.cons].t:null,2],["Categoría",d.cat,2],
  ["Probabilidad",S.inh.p,3],["Impacto",S.inh.i,3],["Control preventivo",c.prev!=null?r.ctrls[c.prev].t:null,4],["Control detectivo",c.det!=null?r.ctrls[c.det].t:null,4],
  ["Respuesta",x.estr,6],["Responsable",x.quien!=null?rp.quien[x.quien].t:null,6],["Disparador",x.disp!=null?rp.disp[x.disp].t:null,6],["Contingencia",x.cont!=null?rp.cont[x.cont].t:null,6],["Indicador",x.ind!=null?rp.ind[x.ind].t:null,6]]}
function ficha(){const el=$("#ficha");if(S.step===0||S.step===8||!S.rk){el.hidden=true;$("#desk").classList.add("solo");return}
 el.hidden=false;$("#desk").classList.remove("solo");const rows=fichaRows(),n=rows.filter(r=>r[1]!=null&&r[1]!=="").length,r=RK();
 const ext=S.inh.p?` · ${S.inh.p}×${S.inh.i}=${S.inh.p*S.inh.i}`:"";
 el.innerHTML=`<div class="fhead"><small>FICHA DEL TALLER · ${r.id}</small><b>${r.name}</b><small>${n} de 13 campos${ext}</small><div class="fprog"><i style="width:${n/13*100}%"></i></div></div>
 <div class="fbody">${rows.map(([k,v,st])=>{const on=v!=null&&v!=="";return`<div class="fr ${on?(S.fb[st]?"ok":"on"):"off"}"><i></i><div><small>${k}</small><span>${on?esc(v):"pendiente"}</span></div></div>`}).join("")}</div>`}

function render(){route();tick();const f=[vCaso,vDiag,vRed,vInh,vCtrl,vRes,vResp,vSig,vFin][S.step];
 $("#app").innerHTML=`<div class="card">${f.html()}</div>`;f.bind&&f.bind();ficha()}

/* ===== Fase 0: el caso ===== */
function isoHTML(){let h="";for(let p=5;p>=1;p--)for(let i=1;i<=5;i++){const v=p*i,l=lvl(v)[1];h+=`<span class="h" style="background:var(--${l});--z:${v*1.3}px;animation-delay:${(p+i)*.12}s"></span>`}return h}
const vCaso={html(){const s=S.student;return`
 <section class="hero"><div class="stack" style="gap:14px">
   <div class="eyebrow">Ejercicio práctico individual <span class="tm">30 minutos</span></div>

  <div class="stack"><h3>Reglas acordadas en el plan de gestión de riesgos</h3><div class="rules">${CASE.rules.map(x=>`<div>${x}</div>`).join("")}</div></div>
  <div class="taskbox"><h3>Tu tarea en 30 minutos</h3><p>Elige uno de los riesgos identificados y completa su ficha en 7 fases. Cada fase se valida al terminarla y ya no se puede cambiar. Campos que vas a construir:</p>
   <div class="fields">${["Causa","Evento","Consecuencia","Categoría","Probabilidad","Impacto","Control preventivo","Control detectivo","Respuesta","Responsable","Disparador","Contingencia","Indicador"].map(f=>`<span>${f}</span>`).join("")}</div>
   <p class="note">Al final defiendes en pocas líneas por qué priorizaste el riesgo y qué evidencia necesitarías para validar tu valoración.</p></div>
 </div>
 <div class="stack" id="empezar" style="scroll-margin-top:150px">

   <label class="f">Nombre completo<input type="text" id="nombre" value="${esc(s.nombre)}" autocomplete="name"></label>
   <label class="f">Documento o ID estudiantil<input type="text" id="doc" value="${esc(s.doc)}"></label>
   <label class="f">NRC / curso<input type="text" id="nrc" value="${esc(s.nrc)}"></label>
   <label class="f">Grupo o jornada<input type="text" id="grupo" value="${esc(s.grupo)}"></label></div>
  <h3>Elige el riesgo que vas a construir</h3>
  <div class="risks">${Object.entries(R).map(([k,r])=>`<button class="rk ${S.rk===k?"sel":""}" data-k="${k}">${ICONS[k]}<code>${r.id} · ${r.area}</code><b>${r.name}</b><span class="muted">${r.hint}</span></button>`).join("")}</div>
  <div class="actions"><button class="btn" id="start">${S.t0?"Continuar":"Comenzar · inicia el cronómetro"} →</button></div>
  <p class="note">Tu avance se guarda en este navegador: si recargas la página, continúas donde ibas.</p></div>`},
 bind(){const chk=()=>{$("#start").disabled=!(S.rk&&S.student.nombre.trim().length>2&&S.student.doc.trim())};
  ["nombre","doc","nrc","grupo"].forEach(id=>$("#"+id).oninput=e=>{S.student[id]=e.target.value;save();chk()});
  $$(".rk").forEach(b=>b.onclick=()=>{if(S.t0&&S.rk&&S.rk!==b.dataset.k)return;S.rk=b.dataset.k;$$(".rk").forEach(x=>x.classList.toggle("sel",x===b));save();chk()});
  $("#casepdf").onclick=()=>savePDF(buildCasePDF,"Caso_plataforma_matricula_UNIMINUTO.pdf",$("#casemsg"),$("#casepdf"));

/* ===== Fase 1 ===== */
const vDiag={html(){const ord=shuf(DIAG.length,"diag"),L=!!S.fb[1];return`
 ${head(1,3,"¿Riesgo, problema, supuesto, restricción o dependencia?","Antes de construir tu riesgo, confirma que sabes distinguirlo. Clasifica cada enunciado del proyecto.")}
 <div class="stack">${ord.map(i=>{const q=DIAG[i],a=S.diag[i];return`<div class="q"><div class="say">${q.t}</div><div class="chips">${DOPTS.map(o=>{let c=a===o?"sel":"";if(L)c=o===q.a?(a===o?"right":""):(a===o?"wrong":"");return`<button class="chip ${c}" data-q="${i}" data-o="${o}" ${L?"disabled":""}>${o}</button>`}).join("")}</div>${L?`<div class="note">${a===q.a?"✓":"✗ Respuesta: "+q.a+"."} ${q.x}</div>`:""}</div>`}).join("")}</div>
 ${fbBox(1)}${nav(1,Object.keys(S.diag).length===DIAG.length)}`},
 bind(){$$("[data-q]").forEach(b=>b.onclick=()=>{S.diag[b.dataset.q]=b.dataset.o;save();render()});
  bindNav(1,()=>{const ok=DIAG.filter((q,i)=>S.diag[i]===q.a).length;S.sc[1]=10*ok/DIAG.length;
   S.fb[1]={c:cls(ok/DIAG.length),h:`${ok} de ${DIAG.length} correctas`,b:`<p>Un riesgo es <b>incierto</b> y está en el futuro; un problema ya ocurrió. Los supuestos, las restricciones y las dependencias pueden <b>originar</b> riesgos, pero no lo son.</p>`}})}};

/* ===== Fase 2 ===== */
function sentence(){const r=RK(),d=S.red,g=t=>`<span class="gap">${t}</span>`;
 return`Debido a que ${d.causa!=null?`<em>${esc(r.causa[d.causa].t)}</em>`:g("[causa]")}, podría ocurrir ${d.evento!=null?`<em>${esc(r.evento[d.evento].t)}</em>`:g("[evento incierto]")}, lo que generaría ${d.cons!=null?`<em>${esc(r.cons[d.cons].t)}</em>`:g("[consecuencia]")} en el objetivo ${d.obj?`<em>${d.obj}: ${esc(objT(d.obj))}</em>`:g("[objetivo]")}.`}
function plainSentence(){const r=RK(),d=S.red;return`Debido a que ${r.causa[d.causa].t}, podría ocurrir ${r.evento[d.evento].t}, lo que generaría ${r.cons[d.cons].t} en el objetivo ${d.obj} (${objT(d.obj)}).`}
function optList(key,arr,sel,L,okFn,attr="key"){const ord=shuf(arr.length,key);return`<div class="opts">${ord.map((i,n)=>{const o=arr[i];let c=sel==i?"sel":"";if(L)c=okFn(o)?(sel==i?"right":""):(sel==i?"wrong":"");return`<button class="opt ${c}" data-${attr}="${key}" data-i="${i}" ${L?"disabled":""}><span class="k">${"ABCD"[n]}</span><span>${esc(o.t)}${L&&sel==i&&o.x?`<br><small class="muted">${esc(o.x)}</small>`:""}</span></button>`}).join("")}</div>`}
const redOK=()=>{const d=S.red;return d.causa!=null&&d.evento!=null&&d.cons!=null&&d.obj&&d.cat&&(d.propia||"").trim().length>=40};
const vRed={html(){const r=RK(),d=S.red,L=!!S.fb[2];return`
 ${head(2,6,"Redacta un riesgo útil","Elige la pieza correcta de cada parte y mira cómo se arma la frase. Cuidado: hay consecuencias disfrazadas de causas, problemas que ya ocurrieron y frases vagas.")}
 <div class="sentence">${sentence()}</div>
 <div class="grid2"><div class="stack"><h3>1 · Causa o condición</h3>${optList("causa",r.causa,d.causa,L,o=>o.ok)}</div><div class="stack"><h3>2 · Evento incierto</h3>${optList("evento",r.evento,d.evento,L,o=>o.ok)}</div></div>
 <div class="grid2"><div class="stack"><h3>3 · Consecuencia</h3>${optList("cons",r.cons,d.cons,L,o=>o.ok)}</div>
  <div class="stack"><h3>4 · Objetivo afectado</h3><div class="opts">${OBJ.map(o=>{let c=d.obj===o.id?"sel":"";if(L)c=o.id===r.obj?(d.obj===o.id?"right":""):(d.obj===o.id?"wrong":"");return`<button class="opt ${c}" data-obj="${o.id}" ${L?"disabled":""}><span class="k">${o.id.slice(1)}</span><span>${o.t}</span></button>`}).join("")}</div></div></div>
 <div class="stack"><h3>5 · Categoría</h3><div class="chips">${CATS.map(c=>{let k=d.cat===c?"sel":"";if(L)k=r.cat.includes(c)?(d.cat===c?"right":""):(d.cat===c?"wrong":"");return`<button class="chip ${k}" data-cat="${esc(c)}" ${L?"disabled":""}>${c}</button>`}).join("")}</div></div>
 <label class="f">6 · Escríbelo con tus propias palabras (mínimo 40 caracteres; va en tu ficha, sin puntaje)<textarea id="propia" ${L?"readonly":""}>${esc(d.propia||"")}</textarea></label>
 ${fbBox(2)}${nav(2,redOK())}`},
 bind(){const r=RK();if(!S.fb[2]){$$("[data-key]").forEach(b=>b.onclick=()=>{S.red[b.dataset.key]=+b.dataset.i;save();render()});
  $$("[data-obj]").forEach(b=>b.onclick=()=>{S.red.obj=b.dataset.obj;save();render()});
  $$("[data-cat]").forEach(b=>b.onclick=()=>{S.red.cat=b.dataset.cat;save();render()});
  $("#propia").oninput=e=>{S.red.propia=e.target.value;save();$("#val").disabled=!redOK()}}
  bindNav(2,()=>{const d=S.red;let p=0,m=[];
   if(r.causa[d.causa].ok)p+=5;else m.push("Causa: "+r.causa[d.causa].x);
   if(r.evento[d.evento].ok)p+=5;else m.push("Evento: "+r.evento[d.evento].x);
   if(r.cons[d.cons].ok)p+=4;else m.push("Consecuencia: "+r.cons[d.cons].x);
   if(d.obj===r.obj)p+=3;else m.push("El objetivo más afectado es "+r.obj+".");
   if(r.cat.includes(d.cat))p+=3;else m.push("Categoría esperada: "+r.cat.join(" o ")+".");
   S.sc[2]=p;S.fb[2]={c:cls(p/20),h:p===20?"Redacción sólida":"Revisa estas piezas",b:m.length?`<ul>${m.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"<p>Tu riesgo conecta una condición real con un evento incierto y una consecuencia medible.</p>"}})}};

/* ===== Matriz ===== */
const SP=["Muy baja: sería excepcional","Baja: poco probable, aunque posible","Media: podría ocurrir; hay señales","Alta: hay condiciones favorables","Muy alta: probable o inminente"];
const SI=["Insignificante: absorbible","Menor: ajuste local","Moderado: reprogramar o pocos recursos extra","Mayor: afecta un hito, el costo o la calidad","Crítico: compromete objetivos clave"];
function matrix(id,sel,exp,L){let h=`<div class="mxbox"><div class="ax y">Probabilidad</div><div class="mx" id="${id}">`;
 for(let p=5;p>=1;p--)for(let i=1;i<=5;i++){const v=p*i;h+=`<button class="${lvl(v)[1]} ${sel&&sel.p===p&&sel.i===i?"sel":""} ${exp&&exp.p===p&&exp.i===i?"exp":""}" data-p="${p}" data-i="${i}" ${L?"disabled":""} aria-label="Probabilidad ${p}, impacto ${i}">${v}</button>`}
 return h+`</div><div></div><div class="ax">Impacto →</div></div>`}
function readout(x){if(!x||!x.p)return`<div class="readout"><span class="muted">Toca una celda de la matriz para ubicar el riesgo.</span></div>`;const v=x.p*x.i,[n,l]=lvl(v);
 return`<div class="readout"><span class="v">${x.p} × ${x.i} = ${v} <span class="lvl ${l}">${n}</span></span><span><b>P ${x.p}</b> · ${SP[x.p-1]}</span><span><b>I ${x.i}</b> · ${SI[x.i-1]}</span></div>`}

/* ===== Fase 3 ===== */
const vInh={html(){const r=RK(),L=!!S.fb[3],x=S.inh;return`
 ${head(3,4,"¿Qué tan grave es antes de los controles?","Usa la evidencia del caso para ubicar el riesgo en la matriz. No adivines: justifica con datos.")}
 <div class="grid2"><div class="stack"><h3>Evidencia disponible</h3><div class="ev">${r.evid.map(e=>`<div>${esc(e)}</div>`).join("")}</div>${readout(x)}</div>
  <div class="stack" style="align-items:center">${matrix("mxi",x,L?{p:r.P,i:r.I}:null,L)}${L?`<p class="note">El recuadro punteado marca la valoración de referencia.</p>`:""}</div></div>
 <label class="f">Justifica tu valoración con la evidencia (mínimo 30 caracteres)<textarea id="just" ${L?"readonly":""}>${esc(x.just||"")}</textarea></label>
 ${fbBox(3)}${nav(3,x.p&&(x.just||"").trim().length>=30)}`},
 bind(){const r=RK();if(!S.fb[3]){$$("#mxi button").forEach(b=>b.onclick=()=>{S.inh.p=+b.dataset.p;S.inh.i=+b.dataset.i;save();render()});
  $("#just").oninput=e=>{S.inh.just=e.target.value;save();$("#val").disabled=!(S.inh.p&&e.target.value.trim().length>=30)}}
  bindNav(3,()=>{const x=S.inh,ax=(a,b)=>a===b?7.5:Math.abs(a-b)===1?4:0,p=ax(x.p,r.P)+ax(x.i,r.I);S.sc[3]=p;
   S.fb[3]={c:cls(p/15),h:`Tu valoración: ${x.p*x.i} · Referencia: ${r.P}×${r.I}=${r.P*r.I} (${lvl(r.P*r.I)[0]})`,b:`<ul><li>${r.pex}</li><li>${r.iex}</li></ul><p class="note">Una diferencia de un punto recibe crédito parcial: las escalas se acuerdan en equipo y con evidencia.</p>`}})}};

/* ===== Fase 4 ===== */
const vCtrl={html(){const r=RK(),L=!!S.fb[4],c=S.ctrl,act=c.slot||"prev",ord=shuf(r.ctrls.length,"ctrls");
 const slot=(k,lab,desc,col)=>{const ct=c[k]!=null?r.ctrls[c[k]]:null;return`<button class="slot ${!L&&act===k?"act":""}" data-slot="${k}" ${L?"disabled":""}><h3><i style="background:${col}"></i>${lab}</h3><span class="note">${desc}</span>${ct?`<span>${esc(ct.t)}</span>${L?`<div class="attrs">${ATTR.map((a,j)=>`<span class="${ct.a[j]?"y":""}">${ct.a[j]?"✓":"✗"} ${a}</span>`).join("")}</div><span class="note">Tipo real: <b>${ct.ty}</b> · ${ct.st?"bien diseñado":"débil"}</span>`:""}`:`<span class="ph">${act===k?"Ahora elige un control del banco ↓":"Toca aquí para llenar este espacio"}</span>`}</button>`};
 return`${head(4,5,"Diseña dos controles que funcionen","Necesitas un control <b>preventivo</b> (reduce la posibilidad) y uno <b>detectivo</b> (avisa a tiempo). Un buen control dice quién, qué, cuándo, con qué evidencia, qué pasa si hay desviaciones y quién lo revisa.")}
 <div class="slots">${slot("prev","Control preventivo","Evita o reduce la posibilidad.","var(--blue)")}${slot("det","Control detectivo","Identifica que algo ocurrió o está ocurriendo.","var(--sun)")}</div>
 <div class="stack"><h3>Banco de controles propuestos por el equipo</h3><div class="opts">${ord.map((i,n)=>{const u=c.prev==i||c.det==i;return`<button class="opt ${u?"used sel":""}" data-c="${i}" ${L?"disabled":""}><span class="k">${n+1}</span><span>${esc(r.ctrls[i].t)}</span></button>`}).join("")}</div></div>
 ${fbBox(4)}${nav(4,c.prev!=null&&c.det!=null)}`},
 bind(){const r=RK();if(!S.fb[4]){$$("[data-slot]").forEach(s=>s.onclick=()=>{S.ctrl.slot=s.dataset.slot;save();render()});
  $$("[data-c]").forEach(b=>b.onclick=()=>{const i=+b.dataset.c,k=S.ctrl.slot||"prev",o=k==="prev"?"det":"prev";if(S.ctrl[o]==i)S.ctrl[o]=null;S.ctrl[k]=i;if(S.ctrl[o]==null)S.ctrl.slot=o;save();render()})}
  bindNav(4,()=>{const c=S.ctrl,m=[];let p=0;[["prev","Preventivo"],["det","Detectivo"]].forEach(([k,ty])=>{const ct=r.ctrls[c[k]];
    if(ct.ty===ty&&ct.st)p+=7.5;else if(ct.ty===ty){p+=2.5;m.push(`${ty}: el tipo es correcto, pero el control es débil. Le falta: ${ATTR.filter((a,j)=>!ct.a[j]).join(", ")}.`)}
    else if(ct.st){p+=2.5;m.push(`${ty}: elegiste un control bien diseñado, pero es de tipo ${ct.ty}.`)}else m.push(`${ty}: el control es de tipo ${ct.ty} y además es débil.`)});
   S.sc[4]=p;S.fb[4]={c:cls(p/15),h:p===15?"Controles bien diseñados":"Tus controles necesitan ajustes",b:m.length?`<ul>${m.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><p class="note">«Un control no es una frase en una matriz: es una acción verificable que funciona.»</p>`:"<p>Ambos controles tienen responsable, acción, frecuencia, evidencia, manejo de desviaciones y revisión independiente.</p>"}})}};

/* ===== Fase 5 ===== */
function expRes(){const r=RK(),c=S.ctrl,pv=r.ctrls[c.prev],dt=r.ctrls[c.det];return{p:Math.max(1,S.inh.p-(pv.ty==="Preventivo"&&pv.st?2:0)),i:Math.max(1,S.inh.i-(dt.ty==="Detectivo"&&dt.st?1:0))}}
const vRes={html(){const r=RK(),L=!!S.fb[5],x=S.res,c=S.ctrl,iv=S.inh.p*S.inh.i;return`
 ${head(5,3,"¿Cuánto riesgo queda con tus controles?",`Tu valoración inherente fue <b>${S.inh.p}×${S.inh.i}=${iv}</b> <span class="lvl ${lvl(iv)[1]}">${lvl(iv)[0]}</span>. Lee la verificación de tus controles y reevalúa <b>solo con evidencia</b>.`)}
 <div class="report"><span class="tag">VERIFICACIÓN DE CONTROLES</span><p><b>Preventivo:</b> ${esc(r.ctrls[c.prev].ev)}</p><p><b>Detectivo:</b> ${esc(r.ctrls[c.det].ev)}</p></div>
 <div class="grid2"><div class="stack">${readout(x)}<p class="note">Pista: un control preventivo eficaz suele bajar la probabilidad; uno detectivo eficaz reduce el impacto porque permite reaccionar a tiempo. Sin evidencia de funcionamiento, el residual es igual al inherente.</p></div>
  <div class="stack" style="align-items:center">${matrix("mxr",x,L?expRes():null,L)}</div></div>
