<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}</style></head><body><title>Simulador Café Altiplano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: centro de mando oscuro (tema único deliberado). Izquierda: la decisión del momento. Derecha: tablero del proyecto en vivo. */
:root{
  color-scheme:dark;
  --bg:#0a1120; --panel:#111b30; --panel2:#17243f; --raise:#1d2d4f; --line:#26375c; --ink:#ebf0fa; --muted:#93a3c4; --dim:#64759a;
  --sun:#ffcc00; --blue:#5b86ff; --blue-ink:#0a1120; --ok:#3ddc97; --ok-bg:rgba(61,220,151,.12); --warn:#ffb547; --warn-bg:rgba(255,181,71,.12); --bad:#ff6b6b; --bad-bg:rgba(255,107,107,.12); --opp:#b796ff; --opp-bg:rgba(183,150,255,.13);
  --display:"Unbounded","Segoe UI",system-ui,sans-serif; --body:"Manrope","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;background-image:radial-gradient(circle at 15% -10%,rgba(91,134,255,.18),transparent 45%),radial-gradient(circle at 110% 10%,rgba(255,204,0,.08),transparent 40%);background-attachment:fixed}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:rgba(10,17,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{background:#fff;border-radius:10px;padding:5px 9px;display:flex;flex-shrink:0}
.logo img{height:38px;width:auto;display:block}
.ttl{flex:1;min-width:0}
.ttl b{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.01em;display:block;line-height:1.15}
.ttl span{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{display:flex;align-items:center;gap:8px;flex-shrink:0}
.clock svg{width:40px;height:40px;transform:rotate(-90deg)}
.clock circle{fill:none;stroke-width:5}.clock .bg{stroke:var(--line)}.clock .fg{stroke:var(--sun);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.clock.out .fg{stroke:var(--bad)}
.clock b{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums}
.clock small{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.route{display:flex;gap:6px;padding-block:0 10px;overflow-x:auto;scrollbar-width:none}
.route div{flex:1;min-width:64px;font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:5px;font-weight:600;letter-spacing:.02em}
.route div i{height:4px;border-radius:2px;background:var(--line)}
.route div.done{color:var(--muted)} .route div.done i{background:var(--blue)}
.route div.cur{color:var(--ink)} .route div.cur i{background:var(--sun);box-shadow:0 0 12px rgba(255,204,0,.6)}
@media (max-width:720px){.ttl span,.clock small{display:none}.logo img{height:30px}.ttl b{font-size:14px}}
.desk{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start;padding-block:22px 60px}
.desk.solo{grid-template-columns:minmax(0,1fr)}
@media (max-width:1020px){.desk{grid-template-columns:minmax(0,1fr)}.desk aside{order:-1}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:600px){.card{padding:16px;border-radius:16px}}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,46px);line-height:1.05;letter-spacing:-.02em}
h2{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.5vw,26px);line-height:1.15;letter-spacing:-.01em}
h3{font-size:16px;font-weight:800}
p{margin:0;max-width:70ch}
.lead{color:var(--muted);font-size:16px}
.muted{color:var(--muted)} .note{font-size:13px;color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--sun);display:flex;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.grid2>*{min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{background:var(--sun);color:#1c1600;border:0;border-radius:12px;padding:12px 20px;font-weight:800;display:inline-flex;gap:8px;align-items:center}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.blue{background:var(--blue);color:#fff}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
/* portada */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:30px;background:linear-gradient(135deg,#13254d 0%,#0f1a33 60%);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:16px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:20px}}
.hero h1 em{font-style:normal;color:var(--sun)}
.hero svg.mount{width:100%;height:auto;max-height:240px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--panel2);border-radius:14px;padding:12px 14px}
.fact small{display:block;color:var(--muted);font-size:12px}
.fact b{font-family:var(--display);font-size:20px;font-weight:700}
.sec{background:var(--panel2);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.objs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.obj{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;font-size:14px}
.obj b{font-family:var(--mono);color:var(--sun)}
.places{display:flex;flex-wrap:wrap;gap:6px}
.places span{font-size:13px;border-radius:999px;padding:4px 11px;background:var(--raise)}
.places span.by{box-shadow:inset 3px 0 0 #3ddc97} .places span.cu{box-shadow:inset 3px 0 0 var(--blue)}
ul.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
/* registro */
.risks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
/* plan */
.rcard{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.rcard.opp{border-color:rgba(183,150,255,.45);background:linear-gradient(180deg,rgba(183,150,255,.08),transparent 60%),var(--panel2)}
.rtop{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.rid{font-family:var(--mono);font-size:12px;color:var(--sun);font-weight:600}
.rcard.opp .rid{color:var(--opp)}
.rname{font-weight:800;font-size:16.5px;line-height:1.3}
.rmeta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.tag{border-radius:999px;padding:2px 9px;background:var(--raise);color:var(--muted);font-weight:600}
.pdots{display:inline-flex;gap:3px;vertical-align:middle}
.pdots i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.pdots i.on{background:var(--warn)} .rcard.opp .pdots i.on{background:var(--opp)}
.resp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.ro{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,transform .15s}
.ro:hover{border-color:var(--blue);transform:translateY(-1px)}
.ro.sel{border-color:var(--sun);background:rgba(255,204,0,.07);box-shadow:0 0 0 1px var(--sun) inset}
.ro .k{display:flex;justify-content:space-between;gap:6px;font-weight:800;font-size:13.5px}
.ro .k span{font-family:var(--mono);font-size:12.5px;color:var(--sun)}
.ro small{color:var(--muted);font-size:12.5px;line-height:1.4}
.ro .eff{font-family:var(--mono);font-size:11.5px;color:var(--blue)}
.ro:disabled{cursor:default;transform:none}
/* tablero */
aside.board{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);display:flex;flex-direction:column;gap:10px}
@media (max-width:1020px){aside.board{position:static}}
.bhead{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.budget{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.budget .big{font-family:var(--display);font-size:24px;font-weight:700}
.sbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg)}
.sbar i{display:block;height:100%;transition:width .5s}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:1020px){.tiles{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.tile small{font-size:11.5px;color:var(--muted);font-weight:600}
.tile b{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .tg{font-size:11px;color:var(--dim)}
.tile.g{box-shadow:inset 0 -3px 0 var(--ok)} .tile.r{box-shadow:inset 0 -3px 0 var(--bad)} .tile.w{box-shadow:inset 0 -3px 0 var(--warn)}
.tile.flash{animation:flash .9s}
@keyframes flash{0%{background:var(--raise)}100%{background:var(--panel)}}
/* rondas */
.phase-h{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.phase-h .num{font-family:var(--display);font-size:44px;font-weight:800;color:var(--sun);line-height:1}
.feed{display:flex;flex-direction:column;gap:10px}
.news{border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--panel2)}
.news.fresh{animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.news.hit{border-color:rgba(255,107,107,.45);background:linear-gradient(90deg,rgba(255,107,107,.1),transparent 50%),var(--panel2)}
.news.safe{border-color:rgba(61,220,151,.35);background:linear-gradient(90deg,rgba(61,220,151,.08),transparent 50%),var(--panel2)}
.news.good{border-color:rgba(183,150,255,.5);background:linear-gradient(90deg,rgba(183,150,255,.12),transparent 50%),var(--panel2)}
.news .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:12px;letter-spacing:.06em}
.badge{border-radius:6px;padding:2px 8px;font-weight:600}
.hit .badge{background:var(--bad-bg);color:var(--bad)} .safe .badge{background:var(--ok-bg);color:var(--ok)} .good .badge{background:var(--opp-bg);color:var(--opp)}
.news h3{font-size:17px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.ch{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:5px}
.ch:hover:not(:disabled){border-color:var(--sun)}
.ch b{font-size:14px}
.ch.sel{border-color:var(--sun);background:rgba(255,204,0,.07)}
.ch:disabled{cursor:default}
.ch:disabled:not(.sel){opacity:.45}
.deltas{display:flex;flex-wrap:wrap;gap:5px}
.d{font-family:var(--mono);font-size:11.5px;border-radius:6px;padding:2px 7px;font-weight:600}
.d.n{background:var(--bad-bg);color:var(--bad)} .d.p{background:var(--ok-bg);color:var(--ok)} .d.z{background:var(--raise);color:var(--muted)}
.warnline{font-size:12.5px;color:var(--warn)}
.outcome{border-left:3px solid var(--sun);padding-left:12px;font-size:14px;color:var(--muted)}
.sum{background:var(--panel2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
/* cierre */
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.goal{border-radius:14px;padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.goal.ok{background:var(--ok-bg);border-color:rgba(61,220,151,.4)} .goal.no{background:var(--bad-bg);border-color:rgba(255,107,107,.4)}
.goal b{font-family:var(--mono);font-size:20px}
.goal small{color:var(--muted)}
.result{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:600px){.result{grid-template-columns:1fr}}
.seal{width:160px;height:160px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--sun) calc(var(--v)*1%),var(--line) 0);position:relative}
.seal::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--panel)}
.seal div{position:relative;z-index:1;text-align:center}
.seal b{font-family:var(--display);font-size:42px;font-weight:800;line-height:1;display:block}
.seal small{color:var(--muted);font-size:12px}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.q{font-family:var(--mono);font-weight:600;white-space:nowrap}
.q.g{color:var(--ok)} .q.m{color:var(--warn)} .q.b{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:9px}
.br{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:4px 10px;font-size:13.5px}
.br .tr{grid-column:1/-1;height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.br .tr i{display:block;height:100%;background:var(--sun);border-radius:4px}
.br .n{text-align:right;font-family:var(--mono);font-size:12.5px}
.toast{border-radius:12px;padding:10px 14px;font-size:14px;margin-top:8px}
.toast.ok{background:var(--ok-bg);color:var(--ok)} .toast.mid{background:var(--warn-bg);color:var(--warn)} .toast.bad{background:var(--bad-bg);color:var(--bad)}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ===== Modelo del proyecto ===== */
function model(){let resp=0,evc=0,comp=0,w=0,pct=0,rep=REP0,vme=0,oppE=0;
 RIDS.forEach(id=>{const r=RISKS[id],o=opt(id);if(!o)return;resp+=o.c;if(o.side)pct+=o.side;const f=o.f??1;
  if(r.opp)oppE+=(o.p/5)*r.val*f;else vme+=(o.p/5)*(r.val*f-(o.comp||0));
  const e=S.ev[id];if(!e||!e.occ)return;
  if(r.ev.auto){evc+=r.ev.auto.c*f}else if(e.ch!=null){const x=r.ev.o[e.ch];const ff=r.opp?f:f;evc+=(x.c||0)*(r.opp?1:f);w+=(x.w||0)*(r.opp?1:f);pct+=(x.pct||0)*ff;rep+=(x.rep||0)*(r.opp?1:f)}
  if(o.comp)comp+=Math.min(o.comp,r.ev.auto?r.ev.auto.c*f:(e.ch!=null?(r.ev.o[e.ch].c||0)*f+(r.ev.o[e.ch].w||0)*25+Math.abs(Math.min(0,r.ev.o[e.ch].pct||0))*4:0))});
 const net=Math.max(0,evc-comp),total=BASE+resp+net,reserve=POOL-resp-net,sales=Math.max(0,SALES*(1+pct/100)*Math.max(0,1-WEEK*w)),profit=sales*MARGIN-total;
 return{resp,evc,comp,net,total,reserve,w,pct,rep:Math.max(0,Math.min(100,rep)),sales,profit,vme,oppE,over:Math.max(0,total-BUDGET)}}

  <div class="actions"><span class="note">Inicia un cronómetro de 30 minutos. Tu avance se guarda en este navegador.</span><button class="btn" id="start">${S.t0?"Continuar":"Asumir la dirección del proyecto"} →</button></div></div>`},
 bind(){const chk=()=>{$("#start").disabled=!(S.student.nombre.trim().length>2&&S.student.doc.trim())};
  ["nombre","doc","nrc","grupo"].forEach(id=>$("#"+id).oninput=e=>{S.student[id]=e.target.value;save();chk()});chk();
  $("#casepdf").onclick=()=>savePDF(buildCasePDF,"Caso_Cafe_Altiplano_UNIMINUTO.pdf",$("#casemsg"),$("#casepdf"));

/* ===== Fase 1: plan ===== */
const dots=p=>`<span class="pdots">${[1,2,3,4,5].map(i=>`<i class="${i<=p?"on":""}"></i>`).join("")}</span>`;
const vPlan={html(){const L=S.approved,n=Object.keys(S.plan).length,m=model();return`
 <div class="eyebrow"><span>Fase 1 · Plan de respuesta</span><span>≈ 10 min</span></div>
 <h2>Decide qué hacer con cada riesgo</h2>
 <p class="lead">Cada respuesta cuesta. Lo que no gastes queda como reserva para pagar los imprevistos. Mira el tablero: el presupuesto, la reserva y la exposición cambian con cada decisión.</p>
 ${RIDS.map(id=>{const r=RISKS[id],sel=S.plan[id];return`<div class="rcard ${r.opp?"opp":""}"><div class="rtop"><div class="stack" style="gap:4px"><span class="rid">${id} · ${r.cat}</span><span class="rname">${r.name}</span></div>
  <div class="rmeta"><span class="tag">Probabilidad ${dots(r.p)} ${r.p}/5</span><span class="tag">${r.opp?"Beneficio":"Impacto"}: ${r.imp}</span></div></div>
  <p class="note">${r.why}</p>
  <div class="resp">${r.opts.map(o=>`<button class="ro ${sel===o.k?"sel":""}" data-r="${id}" data-k="${o.k}" ${L?"disabled":""}><span class="k">${o.k}<span>${o.c?M(o.c):"$0"}</span></span><small>${o.d}</small><span class="eff">${effTxt(r,o)}</span></button>`).join("")}</div></div>`}).join("")}
 ${m.reserve<0?`<p class="warnline">Tus respuestas superan los $60 millones disponibles. Ajusta el plan.</p>`:""}
 <div class="actions"><span class="note">${n} de ${RIDS.length} riesgos con respuesta · reserva ${M(Math.max(0,m.reserve))}</span><button class="btn" id="approve" ${n===RIDS.length&&m.reserve>=0?"":"disabled"}>Presentar el plan a la gerencia →</button></div>`},
 bind(){$$("[data-r]").forEach(b=>b.onclick=()=>{S.plan[b.dataset.r]=b.dataset.k;save();const y=scrollY;render();scrollTo(0,y)});
  const a=$("#approve");a.onclick=()=>{S.approved=true;go(2)}}};
function effTxt(r,o){const a=[];if(o.p!==r.p)a.push(`P ${r.p}→${o.p}`);if(o.f!=null&&o.f!==1)a.push(o.f===0?"impacto cubierto":`impacto ×${o.f}`);if(o.comp)a.push(`compensa hasta ${M(o.comp)}`);if(o.side)a.push(`ventas ${o.side}%`);return a.join(" · ")||"sin cambio"}

/* ===== Rondas ===== */
function deltas(r,o,x){const f=r.opp?1:(o.f??1),a=[];const c=(x.c||0)*f,w=(x.w||0)*f,pc=(x.pct||0)*(r.opp?(o.f??1):f),rp=(x.rep||0)*f;
 if(c)a.push(`<span class="d n">−${M(c)} reserva</span>`);if(w)a.push(`<span class="d n">+${r1(w)} sem atraso</span>`);if(pc)a.push(`<span class="d ${pc>0?"p":"n"}">${pc>0?"+":""}${r1(pc)} % ventas</span>`);if(rp)a.push(`<span class="d n">${rp} satisfacción</span>`);
 if(!a.length)a.push(`<span class="d z">sin costo directo</span>`);return a.join("")}
function newsCard(id,live){const r=RISKS[id],o=opt(id),e=S.ev[id],m=model();
 if(!e.occ){const would=r.roll<r.p/5;const cls=r.opp?"hit":"safe";
  if(r.opp)return`<div class="news hit"><div class="hd"><span class="badge">OPORTUNIDAD PERDIDA</span><span>${id}</span></div><h3>${r.name}: no se concretó</h3><p class="muted">${would?"Con más esfuerzo comercial se habría concretado.":"No se dieron las condiciones."} Tu respuesta: ${o.k}.</p></div>`;
  return`<div class="news safe"><div class="hd"><span class="badge">NO OCURRIÓ</span><span>${id}</span></div><h3>${r.name}: sin novedad</h3><p class="muted">${o.k==="Evitar"?"Lo evitaste desde el plan.":would?`<b style="color:var(--ok)">Tu respuesta (${o.k}) lo evitó:</b> sin ella, este riesgo se habría materializado.`:`No se materializó. Tu respuesta: ${o.k}.`}</p></div>`}
 const cls=r.opp?"good":"hit",f=o.f??1;
 if(r.ev.auto){const c=r.ev.auto.c*f;return`<div class="news ${cls}"><div class="hd"><span class="badge">OCURRIÓ</span><span>${id}</span></div><h3>${r.ev.t}</h3><div class="deltas">${c?`<span class="d n">−${M(c)} reserva</span>`:`<span class="d p">impacto cubierto</span>`}</div><p class="outcome">${o.k==="Transferir"?"La cobertura cambiaria absorbió la variación.":o.k==="Mitigar"?"Comprar en tramos redujo el impacto a la mitad.":"Sin cobertura, pagas la diferencia completa."}</p></div>`}
 const comp=o.comp?`<p class="note">Tu respuesta (${o.k}) te devuelve hasta ${M(o.comp)} si hay costo o pérdida.</p>`:f!==1?`<p class="note">Tu respuesta (${o.k}) reduce el impacto de este evento a la mitad.</p>`:"";
 return`<div class="news ${cls}"><div class="hd"><span class="badge">${r.opp?"OPORTUNIDAD":"OCURRIÓ"}</span><span>${id} · ${r.name}</span></div><h3>${r.ev.t}</h3>${comp}
  <div class="choices">${r.ev.o.map((x,i)=>{const need=(x.c||0)*(r.opp?1:f);const short=e.ch==null&&need>m.reserve+1e-9;return`<button class="ch ${e.ch===i?"sel":""}" data-ch="${i}" ${e.ch!=null||!live?"disabled":""}><b>${x.t}</b><div class="deltas">${deltas(r,o,x)}</div>${short?`<span class="warnline">La reserva no alcanza: requiere aprobación de la patrocinadora (sobrecosto).</span>`:""}</button>`}).join("")}</div>
  ${e.ch!=null?`<p class="outcome">Decisión registrada. El tablero ya refleja el efecto.</p>`:""}</div>`}
function vRound(k){return{html(){const R=ROUNDS[k],ids=R.r,pos=S.pos[k];ids.slice(0,pos+1).forEach(id=>{if(!S.ev[id])S.ev[id]={occ:occurs(id),ch:null}});
  const cur=ids[Math.min(pos,ids.length-1)],e=S.ev[cur],r=RISKS[cur],needChoice=e.occ&&!r.ev.auto&&e.ch==null,last=pos>=ids.length-1;
  return`<div class="phase-h"><span class="num">${k+1}</span><div class="stack" style="gap:2px"><div class="eyebrow"><span>Ronda ${k+1} de 3</span><span>≈ 4 min</span></div><h2>${R.n}</h2></div></div>
  <p class="lead">${R.d}</p>
  <div class="feed">${ids.slice(0,pos+1).map((id,i)=>{let h=newsCard(id,i===pos);if(i===pos&&lastAnim!==id){lastAnim=id;h=h.replace('class="news ','class="news fresh ')}return h}).join("")}</div>
  <div class="actions">${needChoice?`<span class="note">Toma una decisión para continuar.</span>`:last?`<button class="btn" id="nextR">${k<2?"Pasar a la ronda "+(k+2):"Cerrar el proyecto"} →</button>`:`<button class="btn blue" id="nextN">Siguiente noticia (${pos+2} de ${ids.length}) →</button>`}</div>`},
 bind(){save();const ids=ROUNDS[k].r,cur=ids[S.pos[k]];$$("[data-ch]").forEach(b=>b.onclick=()=>{S.ev[cur].ch=+b.dataset.ch;save();const y=scrollY;render();scrollTo(0,y)});
  const n=$("#nextN");if(n)n.onclick=()=>{S.pos[k]++;save();render();setTimeout(()=>{const f=$$(".news");f[f.length-1]?.scrollIntoView({behavior:"smooth",block:"center"})},50)};
  const x=$("#nextR");if(x)x.onclick=()=>{if(k===2)S.tEnd=S.tEnd||Date.now();go(3+k)}}}}

/* ===== Calificación ===== */
function scores(){const m=model(),g=goals(m);
 const qp=RIDS.reduce((a,id)=>a+(opt(id)?.q||0),0)/RIDS.length;const resv=POOL-m.resp;const rs=resv<5?2:resv<=30?8:5;
 const dec=RIDS.filter(id=>S.ev[id]&&S.ev[id].occ&&S.ev[id].ch!=null).map(id=>RISKS[id].ev.o[S.ev[id].ch].q);const qe=dec.length?dec.reduce((a,b)=>a+b,0)/dec.length:1;
 const plan=32*qp+rs,exe=30*qe,res=7.5*g.filter(Boolean).length;return{plan,exe,res,total:plan+exe+res,rs,resv,qp,qe,dec:dec.length,g,m}}
const nota=sc=>Math.max(1,r1(sc.total/100*5)).toFixed(1);
const qc=q=>q>=.85?"g":q>=.5?"m":"b";
function vcode(){const s=JSON.stringify([S.student,S.plan,S.ev,S.t0,S.reflex.length]);let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36).toUpperCase().padStart(7,"0")}

const vFin={html(){const sc=scores(),m=sc.m,n=nota(sc);return`
 <div class="result"><div class="seal" style="--v:${sc.total}"><div><b>${n}</b><small>de 5.0</small></div></div>
  <div class="stack"><div class="eyebrow"><span>Cierre del proyecto</span><span>${esc(S.student.nombre)}</span></div><h2>${sc.g.filter(Boolean).length===4?"Lanzamiento exitoso":sc.g.filter(Boolean).length>=2?"Lanzamiento con tropiezos":"Lanzamiento en problemas"}: cumpliste ${sc.g.filter(Boolean).length} de 4 objetivos</h2>

 <div class="goals">${OBJ.map((o,i)=>{const v=[`${r1(m.w)} semanas`,M(m.total),M(m.sales),`${Math.round(m.rep)}/100`][i];return`<div class="goal ${sc.g[i]?"ok":"no"}"><small>${o.id} · ${o.t}</small><b>${v}</b><small>${sc.g[i]?"✓ Cumplido":"✗ No cumplido"} · ${o.d}</small></div>`}).join("")}</div>
 <div class="sum"><h3>Resultado financiero</h3><p>Ventas ${M(m.sales)} × 45 % de margen − costo total ${M(m.total)} = <b>utilidad de ${M(m.profit)}</b>. ${m.over>0?`Hubo sobrecosto de ${M(m.over)}.`:"Sin sobrecosto."}</p></div>
 <div class="bars">${[["Calidad del plan de respuesta",sc.plan,40],["Decisiones durante la ejecución",sc.exe,30],["Resultados (objetivos cumplidos)",sc.res,30]].map(([t,v,mx])=>`<div class="br"><span>${t}</span><span class="n">${r1(v)} / ${mx}</span><div class="tr"><i style="width:${v/mx*100}%"></i></div></div>`).join("")}</div>
 <h3>Retroalimentación de tu plan</h3>
 <div class="tw"><table class="t"><thead><tr><th>Riesgo</th><th>Tu respuesta</th><th>Calidad</th><th>Comentario</th></tr></thead><tbody>${RIDS.map(id=>{const r=RISKS[id],o=opt(id),best=r.opts.filter(x=>x.q===1).map(x=>x.k).join(" o ");return`<tr><td><b>${id}</b> ${r.name}</td><td>${o.k} (${M(o.c)})</td><td class="q ${qc(o.q)}">${Math.round(o.q*100)} %</td><td>${o.fb}${o.q<1&&best?` <span class="muted">Mejor opción: ${best}.</span>`:""}</td></tr>`}).join("")}
 <tr><td><b>Reserva</b></td><td>${M(sc.resv)}</td><td class="q ${qc(sc.rs/8)}">${Math.round(sc.rs/8*100)} %</td><td>${sc.resv<5?"Casi sin reserva: cualquier imprevisto se vuelve sobrecosto.":sc.resv<=30?"Equilibrio adecuado entre prevenir y guardar para imprevistos.":"Guardaste mucho y respondiste poco: la reserva no sustituye una buena respuesta."}</td></tr></tbody></table></div>
 <h3>Tus decisiones durante la ejecución</h3>
 <div class="tw"><table class="t"><thead><tr><th>Evento</th><th>Tu decisión</th><th>Calidad</th><th>Comentario</th></tr></thead><tbody>${RIDS.filter(id=>S.ev[id]&&S.ev[id].occ&&S.ev[id].ch!=null).map(id=>{const x=RISKS[id].ev.o[S.ev[id].ch];return`<tr><td>${RISKS[id].ev.t}</td><td>${x.t}</td><td class="q ${qc(x.q)}">${Math.round(x.q*100)} %</td><td>${x.fb}</td></tr>`}).join("")||`<tr><td colspan="4">No tuviste que tomar decisiones de contingencia.</td></tr>`}</tbody></table></div>
 <label class="f">Informe de cierre: ¿qué lecciones aprendidas dejas para el próximo proyecto de la empresa? Menciona al menos una decisión que cambiarías y por qué (mínimo 80 caracteres).<textarea id="reflex">${esc(S.reflex)}</textarea></label>
 <div class="actions"><button class="btn ghost" id="reset">Nuevo intento</button><button class="btn ghost" id="casepdf2">Descargar el caso</button><button class="btn" id="pdf" ${S.reflex.trim().length>=80?"":"disabled"}>Descargar informe de gestión (PDF)</button></div><div id="dlmsg"></div>`},
 bind(){$("#reflex").oninput=e=>{S.reflex=e.target.value;save();$("#pdf").disabled=S.reflex.trim().length<80};
  $("#pdf").onclick=()=>savePDF(buildPDF,`Informe_Cafe_Altiplano_${(S.student.nombre||"estudiante").trim().replace(/[^\wáéíóúñÁÉÍÓÚÑ]+/g,"_")}.pdf`,$("#dlmsg"),$("#pdf"));
  $("#casepdf2").onclick=()=>savePDF(buildCasePDF,"Caso_Cafe_Altiplano_UNIMINUTO.pdf",$("#dlmsg"),$("#casepdf2"));
  let armed=false;$("#reset").onclick=e=>{if(!armed){armed=true;e.target.textContent="Confirmar: se borra este intento";return}try{localStorage.removeItem(KEY)}catch(_){}S=fresh();render()};
  if(!S.party){S.party=1;save();if(scores().g.filter(Boolean).length>=3)confetti()}}};

function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=$("#confetti");c.hidden=false;const x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const cols=["#ffcc00","#5b86ff","#3ddc97","#b796ff","#ffffff"],P=Array.from({length:150},()=>({x:innerWidth/2,y:innerHeight*.3,vx:(Math.random()-.5)*15,vy:Math.random()*-13-3,s:Math.random()*7+4,r:Math.random()*6,c:cols[Math.floor(Math.random()*5)]}));let f=0;
 (function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<150)requestAnimationFrame(loop);else c.hidden=true})()}

/* ===== PDF ===== */
const clean=s=>String(s==null||s===""?"—":s).replace(/✓/g,"Sí:").replace(/✗/g,"No:").replace(/→/g,"->").replace(/≤/g,"<=").replace(/≥/g,">=").replace(/−/g,"-").replace(/[  ]/g," ").replace(/[\u{1F300}-\u{1FAFF}☀-➿️]/gu,"").trim();
function pdfKit(title,sub){const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"letter"});const W=215.9,Mg=16,CW=W-2*Mg;const K={doc,W,M:Mg,CW,y:0};
 const navy=[15,42,92],blue=[27,70,145],sun=[255,204,0],ink=[16,27,51],gray=[86,98,125];K.c={navy,blue,sun,ink,gray};
 K.header=()=>{doc.addImage(LOGO,"JPEG",Mg,9,52,16.4);doc.setFont("helvetica","bold");doc.setFontSize(13);doc.setTextColor(...ink);doc.text(title,W-Mg,15,{align:"right"});
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...gray);sub.forEach((s,i)=>doc.text(s,W-Mg,20+i*4.5,{align:"right"}));
  doc.setFillColor(...navy);doc.rect(Mg,29,CW*.62,1.4,"F");doc.setFillColor(...sun);doc.rect(Mg+CW*.62,29,CW*.16,1.4,"F");doc.setFillColor(...blue);doc.rect(Mg+CW*.78,29,CW*.22,1.4,"F");K.y=38};
 K.need=h=>{if(K.y+h>262){doc.addPage();K.header()}};
 K.h2=t=>{K.need(14);doc.setFillColor(...sun);doc.rect(Mg,K.y-3.6,2,5,"F");doc.setFont("helvetica","bold");doc.setFontSize(11.5);doc.setTextColor(...navy);doc.text(clean(t),Mg+4,K.y);K.y+=7};
 K.para=(t,sz=9.5,style="normal")=>{doc.setFont("helvetica",style);doc.setFontSize(sz);doc.setTextColor(...ink);doc.splitTextToSize(clean(t),CW).forEach(l=>{K.need(5);doc.text(l,Mg,K.y);K.y+=sz*.47});K.y+=1.6};
 K.bullet=(t,sz=9.5)=>{doc.setFontSize(sz);const L=doc.splitTextToSize(clean(t),CW-6);K.need(L.length*4.4);doc.setFillColor(...blue);doc.circle(Mg+1.5,K.y-1.2,.9,"F");doc.setFont("helvetica","normal");doc.setTextColor(...ink);doc.text(L,Mg+5,K.y);K.y+=L.length*4.4+1};
 K.row=(k,v,kw=46)=>{doc.setFontSize(9);const L=doc.splitTextToSize(clean(v),CW-kw-4),KL=doc.splitTextToSize(clean(k),kw-4);const h=Math.max(L.length,KL.length)*4.2+3;K.need(h);
  doc.setFillColor(234,238,247);doc.rect(Mg,K.y-3.6,kw,h,"F");doc.setDrawColor(211,219,234);doc.setLineWidth(.2);doc.rect(Mg,K.y-3.6,CW,h);
  doc.setFont("helvetica","bold");doc.setTextColor(...ink);doc.text(KL,Mg+2,K.y);doc.setFont("helvetica","normal");doc.text(L,Mg+kw+2,K.y);K.y+=h};
 K.foot=t=>{const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(...gray);doc.text(clean(t),Mg,272);doc.text(`Página ${i} de ${n}`,W-Mg,272,{align:"right"})}};
 K.header();return K}
function buildCasePDF(){const K=pdfKit("Caso: "+CASE.empresa,["Gerencia de Proyectos · Gestión de Riesgos","Docente: William Parra Forero"]),doc=K.doc;
 doc.setFont("helvetica","bold");doc.setFontSize(17);doc.setTextColor(...K.c.ink);doc.text("Proyecto «Altiplano Origen»",K.M,K.y+2);K.y+=10;
 K.para(CASE.ctx,10.5);K.para(CASE.rol,10.5,"bold");K.y+=2;
 K.h2("Dónde opera: Altiplano Cundiboyacense");K.row("Boyacá",CASE.by.join(" · "),30);K.row("Cundinamarca",CASE.cu.join(" · "),30);K.y+=3;
 K.h2("Cifras del proyecto");[["Presupuesto aprobado","$300 millones"],["Plan base","$240 millones"],["Para riesgos y reserva","$60 millones"],["Ventas de temporada proyectadas","$900 millones (margen bruto 45 %)"]].forEach(([a,b])=>K.row(a,b,60));K.y+=3;
 K.h2("Objetivos");OBJ.forEach(o=>K.row(o.id+" · "+o.t,o.d,60));K.y+=3;
 K.h2("Interesados");K.para(CASE.who.join(" · "));
 K.h2("Reglas del simulador");CASE.rules.forEach(t=>K.bullet(t));K.y+=2;
 K.h2("Registro de riesgos identificados");RIDS.forEach(id=>{const r=RISKS[id];K.row(`${id} · ${r.cat}`,`${r.name}. ${r.why} Probabilidad inicial: ${r.p}/5. ${r.opp?"Beneficio":"Impacto"}: ${r.imp}.`,42)});K.y+=3;
 K.h2("Cómo se desarrolla el simulador");[["1. Plan de respuesta","Para cada riesgo eliges evitar, mitigar, transferir o aceptar (o explotar, mejorar o compartir, si es oportunidad). Lo que no gastes queda como reserva."],["2. Tres rondas","Compras y producción · Alistamiento comercial · Temporada de ventas. Algunos riesgos ocurren según tu plan; ante cada evento decides qué hacer."],["3. Cierre","Ves cuántos objetivos cumpliste, tu nota, la retroalimentación y escribes las lecciones aprendidas."]].forEach(([a,b])=>K.row(a,b,40));
 K.y+=3;K.para("Empresa, cifras y situaciones ficticias con fines didácticos.",8.5,"italic");
 K.foot("UNIMINUTO · Simulador Café Altiplano · Caso");return doc}
function buildPDF(){const sc=scores(),m=sc.m,K=pdfKit("Informe de gestión del proyecto",["Proyecto «Altiplano Origen» · "+CASE.empresa,"Gerencia de Proyectos · Gestión de Riesgos"]),doc=K.doc,{M:Mg,CW}=K,st=S.student;
 doc.setFont("helvetica","bold");doc.setFontSize(16);doc.setTextColor(...K.c.ink);doc.text("Informe del director del proyecto",Mg,K.y+2);K.y+=10;
 [["Estudiante",st.nombre],["Documento / ID",st.doc],["NRC / curso",st.nrc],["Grupo",st.grupo],["Fecha",new Date(S.tEnd||Date.now()).toLocaleString("es-CO",{dateStyle:"long",timeStyle:"short"})],["Tiempo empleado",used()+(over()?" (superó los 30 min)":"")],["Docente","William Parra Forero"]].forEach(([a,b])=>K.row(a,b));K.y+=3;

async function savePDF(make,fn,msg,b){const show=(t,c)=>msg.innerHTML=`<div class="toast ${c}">${t}</div>`;

  if(!dl){if(!window.claude){const u=URL.createObjectURL(doc.output("blob"));const a=document.createElement("a");a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);show("Descargado: "+esc(fn),"ok");return}
   show("La descarga no está disponible en esta vista. Abre el simulador desde su enlace e inténtalo de nuevo.","mid");return}
  await dl.save({filename:fn,data:doc.output("blob")});show("Descargado: "+esc(fn),"ok")}
 catch(e){show(e&&e.code==="declined"?"Cancelaste la descarga. Puedes intentarlo de nuevo.":"No se pudo descargar ("+esc(e&&(e.code||e.message))+"). Intenta de nuevo.","mid")}
 finally{b.disabled=false;b.textContent=lab}}
